plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aiworld.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aiworld.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // APK instalable directamente (sideload). Para Play Store hay que firmar con tu propia llave.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Escaner de QR de Google: no necesita permiso de camara en la app.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
