# Memoria comprimida (zram): en equipos de poca RAM duplica lo que cabe antes de que el sistema se ponga lento.
# Se usa la mitad de la RAM como swap comprimido (zstd); la RAM solo se ocupa a medida que se llena.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
