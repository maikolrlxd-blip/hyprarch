# hyprarch: ajustes para tarjetas de sonido USB (altavoces/auriculares USB, interfaces, DACs).
# Síntoma que arreglan: ruido blanco o chasquidos al empezar un sonido (p. ej. la animación de entrada).
#  - disable-batch: algunas tarjetas USB reportan mal sus tiempos y el modo «batch» de ALSA mete ruido
#  - buffer más grande (headroom y periodo): los USB necesitan más margen que el audio integrado
#  - sin suspensión: no se apaga la tarjeta entre sonidos (el «pop» al encenderla se oye como ruido)
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-batch           = true
        api.alsa.headroom                = 4096
        api.alsa.period-size             = 2048
        api.alsa.period-num              = 3
        session.suspend-timeout-seconds  = 0
        dither.method                    = "wannamaker3"
      }
    }
  }
]
