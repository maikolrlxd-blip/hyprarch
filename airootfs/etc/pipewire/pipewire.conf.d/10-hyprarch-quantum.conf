# hyprarch: más margen de audio para que los sonidos no salgan entrecortados ni con crujidos en equipos reales
# (con el valor por defecto, 256 muestras, cualquier pico de CPU provoca cortes). 1024 muestras a 48 kHz = ~21 ms: no se nota.
context.properties = {
    default.clock.rate          = 48000
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 2048
}
