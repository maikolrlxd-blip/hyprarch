# hyprarch - Hyprland (tema Catppuccin Mocha, minimalista)

monitor = , preferred, auto, 1

$mod     = SUPER
$term    = kitty
$menu    = fuzzel
$files   = thunar
$browser = firefox
$scripts = ~/.config/hypr/scripts

# ---------- Entorno ----------
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = LIBVA_DRIVER_NAME,iHD
env = QT_QPA_PLATFORM,wayland;xcb

# ---------- Autoarranque ----------
exec-once = swaybg -i /usr/share/backgrounds/hyprarch.png -m fill
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Adwaita 24
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark
exec-once = $scripts/welcome.sh

# ---------- Teclado y mouse ----------
input {
    kb_layout = latam,es,us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ---------- Apariencia ----------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    inactive_opacity = 0.96
    blur {
        enabled = true
        size = 5
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(11111baa)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.8, 0.25, 1
    animation = windows, 1, 4, smooth, popin 90%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 5, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# ---------- Atajos ----------
bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, B, exec, $browser
bind = $mod, N, exec, $term -e nmtui
bind = $mod, Q, killactive
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen, 0
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, F1, exec, $scripts/keybinds.sh
bind = $mod, Escape, exec, $scripts/powermenu.sh
bind = $mod SHIFT, V, exec, cliphist list | fuzzel --dmenu --prompt "Portapapeles > " | cliphist decode | wl-copy
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exit

bind = , Print, exec, $scripts/screenshot.sh area
bind = SHIFT, Print, exec, $scripts/screenshot.sh full

# Foco y movimiento
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = ALT, Tab, cyclenext
bind = $mod, Tab, workspace, previous

# Redimensionar
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40

# Espacios de trabajo
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mover/redimensionar ventanas con el mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Teclas multimedia
bindel = , XF86AudioRaiseVolume, exec, $scripts/osd.sh vol-up
bindel = , XF86AudioLowerVolume, exec, $scripts/osd.sh vol-down
bindl = , XF86AudioMute, exec, $scripts/osd.sh mute
bindel = , XF86MonBrightnessUp, exec, $scripts/osd.sh bright-up
bindel = , XF86MonBrightnessDown, exec, $scripts/osd.sh bright-down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
