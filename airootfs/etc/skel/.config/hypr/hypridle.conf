# Ahorro de energía y bloqueo (hypridle). Para apagarlo: borra la línea de hypridle en hyprland.lua.
general {
    lock_cmd = hyprarch-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

# a los 5 minutos sin tocar nada: bloquea
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# a los 6 minutos: apaga la pantalla
listener {
    timeout = 360
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

# a los 30 minutos: suspende (ahorra batería)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
