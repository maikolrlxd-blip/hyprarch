# Los colores vienen de colors.conf (lo genera hyprarch-theme, SUPER + T)
include colors.conf

font_family      JetBrainsMono Nerd Font
font_size        12.0
window_padding_width 12

# Transparencia: Hyprland desenfoca (blur) el fondo detrás de las ventanas translúcidas
background_opacity         0.78
dynamic_background_opacity yes

cursor_shape          beam
cursor_blink_interval 0.5
confirm_os_window_close 0
enable_audio_bell     no

# Copiar y pegar como en Windows: Ctrl+C copia si hay texto seleccionado (si no, interrumpe el programa) y Ctrl+V pega.
# Ctrl+Shift+C / Ctrl+Shift+V y Shift+Insert siguen funcionando.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# Ctrl+Shift+F5 recarga la configuración · Ctrl+Shift+Alt+. / , cambia la opacidad
