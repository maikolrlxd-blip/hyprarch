<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Void Survivors</title>
<style>
:root {
  --bg: #05060f; --panel: rgba(18, 22, 48, .92); --panel2: rgba(30, 36, 78, .9); --line: rgba(120, 150, 255, .28);
  --text: #eaf0ff; --dim: #8e9bd0; --accent: #5df; --accent2: #f6f; --gold: #fc3; --good: #5f9; --bad: #f55;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hidden { display: none !important; }
img.ic { width: 1.25em; height: 1.25em; vertical-align: -0.28em; pointer-events: none; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; padding: var(--safe-t) var(--safe-r) 0 var(--safe-l); }
#xpbar { height: 7px; background: rgba(255,255,255,.12); }
#xpfill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4cf, #c6f); box-shadow: 0 0 8px #8af; }
.hud-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 10px; }
.hud-left { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lvl { font-weight: 800; font-size: 15px; text-shadow: 0 1px 3px #000; }
#hpbar { position: relative; width: min(42vw, 190px); height: 14px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; overflow: hidden; }
#hpfill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #f44, #fa6); transition: width .1s; }
#hptxt { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 14px; font-weight: 700; text-shadow: 0 1px 2px #000; }
#items { display: flex; flex-wrap: wrap; gap: 3px; max-width: min(44vw, 190px); }
#items .it { position: relative; width: 26px; height: 26px; border-radius: 6px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2); display: grid; place-items: center; }
#items .it img { width: 18px; height: 18px; }
#items .it b { position: absolute; right: 1px; bottom: -1px; font-size: 9px; text-shadow: 0 0 3px #000, 0 0 3px #000; }
#clock { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-size: 22px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 4px #000; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-weight: 700; font-size: 14px; text-shadow: 0 1px 3px #000; }
.hud-right .stat { display: flex; align-items: center; gap: 4px; }
.iconbtn { pointer-events: auto; width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 0; }
.iconbtn img { width: 20px; height: 20px; }
#hint { position: absolute; left: 0; right: 0; bottom: 22%; text-align: center; font-size: 18px; font-weight: 700; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .4s; padding: 0 20px; }
#hint.on { opacity: .95; }

/* ---------- Pantallas ---------- */
#screen { position: fixed; inset: 0; pointer-events: none; }
#screen > .scr { position: absolute; inset: 0; pointer-events: auto; overflow-y: auto; overflow-x: hidden; touch-action: pan-y;
  padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + 14px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 14px);
  display: flex; flex-direction: column; align-items: center; }
.scr.bg { background: radial-gradient(ellipse at 50% 0%, rgba(60,40,140,.55), rgba(5,6,15,.94) 70%); }
.scr.dim { background: rgba(3, 4, 12, .72); justify-content: center; }
.wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }

h1.logo { font-size: clamp(34px, 11vw, 58px); line-height: .95; text-align: center; margin: 4vh 0 0; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(180deg, #fff, #5df 55%, #c6f); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(120,160,255,.6)); }
.tag { text-align: center; color: var(--dim); margin: 6px 0 0; letter-spacing: 3px; font-size: 12px; text-transform: uppercase; }
h2.title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 1px; text-align: center; flex: 1; }
.topbar { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 520px; margin-bottom: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; color: var(--gold); }

.btn { appearance: none; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; font-weight: 800; letter-spacing: .5px;
  padding: 12px 16px; border-radius: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s, filter .15s; }
.btn:active { transform: scale(.96); filter: brightness(1.25); }
.btn.big { font-size: 26px; padding: 16px 28px; border-radius: 18px; }
.btn.play { background: linear-gradient(180deg, #5f9, #1a9d6a); color: #04210f; border: 0; box-shadow: 0 6px 0 #0c6b45, 0 0 24px rgba(80,255,150,.35); min-width: 220px; }
.btn.play:active { transform: translateY(4px) scale(.98); box-shadow: 0 2px 0 #0c6b45; }
.btn.gold { background: linear-gradient(180deg, #fd5, #e90); color: #3a2400; border: 0; }
.btn.ghost { background: transparent; }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled], .btn.off { opacity: .45; filter: grayscale(.6); pointer-events: none; }
.btn.red { background: linear-gradient(180deg, #f66, #b22); border: 0; }

.home { align-items: center; gap: 14px; }
.home .pill { position: absolute; left: calc(var(--safe-l) + 12px); top: calc(var(--safe-t) + 12px); }
.home .gear { position: absolute; right: calc(var(--safe-r) + 12px); top: calc(var(--safe-t) + 10px); }
.shipshow { position: relative; width: 150px; height: 150px; margin: 2vh 0; }
.shipshow canvas { width: 100%; height: 100%; }
.stagesel { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 420px; }
.stagesel .card { flex: 1; text-align: center; padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); min-height: 78px; }
.stagesel .card b { display: block; font-size: 17px; }
.stagesel .card small { color: var(--dim); }
.stagesel .arrow { width: 46px; height: 60px; font-size: 22px; padding: 0; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 460px; margin-top: auto; padding-top: 12px; }
.nav .btn { flex-direction: column; gap: 4px; font-size: 12px; padding: 10px 4px; position: relative; }
.nav .btn img { width: 30px; height: 30px; }
.badge { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 5px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.row .ico { width: 54px; height: 54px; border-radius: 14px; background: rgba(0,0,0,.4); display: grid; place-items: center; flex: none; border: 1px solid var(--line); }
.row .ico img { width: 38px; height: 38px; }
.name { font-weight: 800; font-size: 16px; }
.desc { color: var(--dim); font-size: 13px; line-height: 1.3; margin-top: 2px; }
.cost { color: var(--gold); }
.pips { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
.pips i { width: 12px; height: 7px; border-radius: 3px; background: rgba(255,255,255,.15); }
.pips i.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.bar.done > i { background: var(--good); }
.stats3 { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; font-size: 12px; margin-top: 8px; align-items: center; color: var(--dim); }
.list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.sel { border-color: var(--accent); box-shadow: 0 0 14px rgba(80,220,255,.35); }
.lockedc { opacity: .7; }

.streak { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day { text-align: center; border-radius: 10px; padding: 6px 2px; background: rgba(0,0,0,.35); border: 1px solid var(--line); font-size: 11px; color: var(--dim); }
.day b { display: block; color: var(--gold); font-size: 13px; }
.day.past { opacity: .45; } .day.today { border-color: var(--gold); color: var(--text); box-shadow: 0 0 10px rgba(255,200,60,.35); }

.switch { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,.07); }
.tog { width: 52px; height: 28px; border-radius: 14px; background: rgba(255,255,255,.18); position: relative; border: 0; padding: 0; }
.tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog.on { background: var(--good); } .tog.on::after { transform: translateX(24px); }
.seg { display: flex; gap: 6px; }
.seg .btn { padding: 7px 14px; } .seg .btn.on { background: var(--accent); color: #012; border-color: transparent; }

/* ---------- Mejoras al subir de nivel ---------- */
.lv-title { text-align: center; font-size: 26px; font-weight: 900; color: #ff6; text-shadow: 0 0 14px rgba(255,255,100,.6); margin: 0 0 4px; }
.lv-sub { text-align: center; color: var(--dim); margin: 0 0 8px; }
.choice { width: 100%; text-align: left; padding: 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel); color: var(--text); font: inherit; display: flex; gap: 12px; align-items: center; cursor: pointer; }
.choice:active { transform: scale(.98); }
.choice.weapon { border-color: rgba(255,200,80,.6); } .choice.passive { border-color: rgba(100,220,255,.5); }
.choice .ico { width: 58px; height: 58px; border-radius: 14px; background: rgba(0,0,0,.45); display: grid; place-items: center; flex: none; }
.choice .ico img { width: 42px; height: 42px; }
.choice .tagnew { font-size: 11px; color: #4f9; font-weight: 800; letter-spacing: 1px; }
.choice .lvl { font-size: 12px; color: var(--gold); font-weight: 800; }

.big-num { font-size: 56px; font-weight: 900; text-align: center; line-height: 1; }
.win { color: #6f9; text-shadow: 0 0 20px rgba(100,255,150,.6); } .lose { color: #f66; text-shadow: 0 0 20px rgba(255,80,80,.5); }
.res { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 4px 6px; }
.res span:nth-child(odd) { color: var(--dim); } .res span:nth-child(even) { font-weight: 800; text-align: right; }
.newb { color: var(--gold); text-align: center; font-weight: 800; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
.sp { height: 4px; }

#toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 90px); transform: translate(-50%, 20px); background: rgba(10,14,40,.95); border: 1px solid var(--line);
  padding: 10px 16px; border-radius: 12px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-height: 560px) { .shipshow { display: none; } h1.logo { margin-top: 1vh; } }
@media (orientation: landscape) and (max-height: 520px) { .wrap { max-width: 640px; } }

.shipshow img { width: 100%; height: 100%; object-fit: contain; animation: float 3.2s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(100,200,255,.55)); }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
.gear { position: absolute; }
a.btn { text-decoration: none; }

.choice.evo { border-color: #fc3; background: linear-gradient(135deg, rgba(90,60,0,.55), var(--panel)); box-shadow: 0 0 18px rgba(255,200,60,.45); animation: pulse 1.2s infinite alternate; }

.diffseg { width: 100%; max-width: 420px; justify-content: center; } .diffseg .btn { flex: 1; padding: 8px 6px; font-size: 13px; }
.cta { animation: pulse 1s infinite alternate; }

:root{color-scheme:dark}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><i id="xpfill"></i></div>
  <div class="hud-row">
    <div class="hud-left">
      <div class="lvl"><span id="lvl">Nv 1</span></div>
      <div id="hpbar"><i id="hpfill"></i><b id="hptxt"></b></div>
      <div id="items"></div>
    </div>
    <div id="clock">0:00</div>
    <div class="hud-right">
      <button id="pausebtn" class="iconbtn" data-a="pause" aria-label="Pausa"></button>
      <div class="stat" id="killsStat"></div>
      <div class="stat" id="coinsStat"></div>
    </div>
  </div>
  <div id="hint"></div>
</div>

<div id="screen"></div>
<div id="toast"></div>
<script>
/* js/util.js */
(function (g) {
  'use strict';
  const VS = (g.VS = g.VS || {});
  // WebView antiguos (Chrome < 99) no tienen roundRect: polyfill mínimo para no romper el dibujado.
  if (g.CanvasRenderingContext2D && !g.CanvasRenderingContext2D.prototype.roundRect) {
    g.CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.max(0, Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2));
      this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
    };
  }
  VS.util = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    // PRNG determinista (mulberry32), usado para las misiones diarias.
    rng(seed) {
      let a = seed >>> 0;
      return function () {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
      return h >>> 0;
    },
    fmtTime(s) {
      s = Math.max(0, Math.floor(s));
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    },
    fmtNum(n) {
      n = Math.floor(n);
      if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
      if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K';
      return String(n);
    },
    today(d) {
      d = d || new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    },
    daysBetween(a, b) {
      const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
      return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5);
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/data.js */
// Datos del juego: todo el balance vive aquí.
(function (g) {
  'use strict';
  const VS = (g.VS = g.VS || {});
  const D = (VS.data = {});

  D.MAX_WEAPONS = 4;
  D.MAX_PASSIVES = 5;
  D.tune = { hpA: 0.42, hpB: 0.05, dmg: 1.5, xpA: 3.2, xpB: 0.28 };
  D.xpNeed = (lv) => Math.round(4 + lv * D.tune.xpA + lv * lv * D.tune.xpB);

  // ---- Armas: tabla de estadísticas por nivel (1..6) ----
  const lv = (base, rows) => rows.map((r) => Object.assign({}, base, r));
  D.weapons = {
    pulse: {
      color: '#6ff', max: 6, kind: 'shot',
      levels: lv({ cd: 0.6, n: 1, dmg: 10, pierce: 0, spd: 520 }, [
        {}, { cd: 0.55, dmg: 14 }, { cd: 0.52, n: 2, dmg: 14 }, { cd: 0.48, n: 2, dmg: 18, pierce: 1 },
        { cd: 0.44, n: 3, dmg: 18, pierce: 1 }, { cd: 0.4, n: 3, dmg: 26, pierce: 2 },
      ]),
    },
    orbit: {
      color: '#fd5', max: 6, kind: 'orbit',
      levels: lv({ n: 2, dmg: 15, R: 62, spin: 3.2 }, [
        {}, { dmg: 19 }, { n: 3, dmg: 19, R: 68 }, { n: 3, dmg: 25, spin: 3.8, R: 74 },
        { n: 4, dmg: 25, R: 80 }, { n: 5, dmg: 32, R: 90, spin: 4.2 },
      ]),
    },
    chain: {
      color: '#9bf', max: 6, kind: 'chain',
      levels: lv({ cd: 1.35, dmg: 16, jumps: 2, range: 150 }, [
        {}, { dmg: 22 }, { cd: 1.2, jumps: 3, dmg: 22 }, { cd: 1.1, dmg: 30, jumps: 4, range: 170 },
        { cd: 1.0, dmg: 36, jumps: 6 }, { cd: 0.85, dmg: 46, jumps: 8, range: 190 },
      ]),
    },
    missile: {
      color: '#f96', max: 6, kind: 'missile',
      levels: lv({ cd: 2.1, n: 1, dmg: 26, aoe: 48 }, [
        {}, { dmg: 34 }, { cd: 1.9, n: 2, dmg: 34 }, { cd: 1.8, n: 2, dmg: 44, aoe: 58 },
        { cd: 1.6, n: 3, dmg: 44 }, { cd: 1.4, n: 4, dmg: 56, aoe: 68 },
      ]),
    },
    nova: {
      color: '#f6f', max: 6, kind: 'nova',
      levels: lv({ cd: 3.6, dmg: 24, R: 140, knock: 260 }, [
        {}, { dmg: 32 }, { cd: 3.2, R: 165, dmg: 32 }, { cd: 3.0, dmg: 44, R: 185 },
        { cd: 2.6, dmg: 56, R: 205 }, { cd: 2.2, dmg: 72, R: 230, knock: 340 },
      ]),
    },
    aura: {
      color: '#6f9', max: 6, kind: 'aura',
      levels: lv({ R: 64, dmg: 8, tick: 0.45, slow: 0.25 }, [
        {}, { dmg: 11 }, { R: 76, dmg: 13 }, { R: 88, dmg: 17, tick: 0.4 },
        { R: 100, dmg: 21 }, { R: 115, dmg: 27, tick: 0.35 },
      ]),
    },
  };


  // ---- Evoluciones: arma al nivel máximo + el pasivo indicado => nivel 7 (versión evolucionada) ----
  const evolve = (id, passive, over) => {
    const w = D.weapons[id];
    w.evo = passive;
    w.levels.push(Object.assign({}, w.levels[w.levels.length - 1], over));
  };
  evolve('pulse', 'overclock', { cd: 0.3, n: 5, dmg: 30, pierce: 3, spd: 700 });
  evolve('orbit', 'lens', { n: 7, dmg: 40, R: 105, spin: 5 });
  evolve('chain', 'power', { cd: 0.7, dmg: 60, jumps: 12, range: 220 });
  evolve('missile', 'magnet', { cd: 1.0, n: 6, dmg: 70, aoe: 90 });
  evolve('nova', 'barrier', { cd: 1.6, dmg: 100, R: 280, knock: 420 });
  evolve('aura', 'regen', { R: 135, dmg: 36, tick: 0.3 });

  // ---- Pasivos: efecto por nivel (máx 5) ----
  D.passives = {
    power: { color: '#f66', max: 5, per: 0.12, fmt: '+12% dmg' },
    overclock: { color: '#fc4', max: 5, per: 0.08, fmt: '-8% cd' },
    thrusters: { color: '#4cf', max: 5, per: 0.08, fmt: '+8% vel' },
    plating: { color: '#9d6', max: 5, per: 0.12, fmt: '+12% HP' },
    magnet: { color: '#c8f', max: 5, per: 0.25, fmt: '+25% imán' },
    barrier: { color: '#8af', max: 5, per: 1, fmt: '+1 armadura' },
    scholar: { color: '#6fd', max: 5, per: 0.1, fmt: '+10% XP' },
    regen: { color: '#f9a', max: 5, per: 0.4, fmt: '+0.4 HP/s' },
    lens: { color: '#fa6', max: 5, per: 0.1, fmt: '+10% área' },
    fortune: { color: '#ff6', max: 5, per: 0.05, fmt: '+5% crit' },
  };

  // ---- Enemigos ----
  D.enemies = {
    swarmer:  { hp: 6,   speed: 98, dmg: 5,  r: 7,  xp: 1,  minT: 0,   w: 6,   beh: 'chase', color: '#f55', shape: 'diamond' },
    grunt:    { hp: 18,  speed: 70, dmg: 8,  r: 11, xp: 2,  minT: 0,   w: 5,   beh: 'chase', color: '#f94', shape: 'hex' },

/* js/save.js */
// Guardado local versionado. Si localStorage no está disponible, funciona en memoria.
(function (g) {
  'use strict';
  const VS = (g.VS = g.VS || {});
  const KEY = 'void_survivors_save';
  const VERSION = 1;

  function defaults() {
    return {
      v: VERSION,
      coins: 0,
      ships: { falcon: true },
      selShip: 'falcon',
      selStage: 's1',
      cleared: {},
      diffUnlocked: {},
      selDiff: 0,
      rated: false,
      best: {},
      meta: {},
      stats: { kills: 0, runs: 0, wins: 0, bossKills: 0, coinsEarned: 0, bestTime: 0, maxLevel: 0, maxWeaponLevel: 0, evolved: 0, playtime: 0 },
      ach: {},
      missions: { day: '', list: [] },
      login: { last: '', streak: 0, claimed: true },
      settings: { sound: 1, music: 1, vibe: 1, shake: 1, numbers: 1, lang: '' },
      tutorial: { done: false, started: false },
    };
  }

  function merge(base, src) {
    if (!src || typeof src !== 'object') return base;
    for (const k of Object.keys(base)) {
      if (!(k in src)) continue;
      if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = merge(base[k], src[k]);
      else base[k] = src[k];
    }
    // claves dinámicas (ships, cleared, best, meta, ach) que no están en defaults
    for (const k of ['ships', 'cleared', 'best', 'meta', 'ach', 'diffUnlocked']) if (src[k] && typeof src[k] === 'object') Object.assign(base[k], src[k]);
    return base;
  }

  const Save = (VS.Save = {
    data: defaults(),
    defaults,
    load() {
      try {
        const raw = g.localStorage && g.localStorage.getItem(KEY);
        if (raw) this.data = merge(defaults(), JSON.parse(raw));
      } catch (e) { this.data = defaults(); }
      this.data.v = VERSION;
      return this.data;
    },
    save() {
      try { g.localStorage && g.localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* sin almacenamiento */ }
    },
    reset() {
      this.data = defaults();
      this.save();
    },
  });
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/meta.js */
// Meta-progresión: mejoras permanentes, naves, misiones diarias, logros y racha de login.
(function (g) {
  'use strict';
  const VS = (g.VS = g.VS || {});
  const U = VS.util, D = VS.data;

  const Meta = (VS.Meta = {});

  Meta.level = (s, id) => s.meta[id] || 0;
  Meta.upgradeCost = (s, id) => D.metaCost(id, Meta.level(s, id));

  Meta.buyUpgrade = function (s, id) {
    const u = D.metaUpgrades[id], lv = Meta.level(s, id);
    if (!u || lv >= u.max) return false;
    const c = D.metaCost(id, lv);
    if (s.coins < c) return false;
    s.coins -= c;
    s.meta[id] = lv + 1;
    return true;
  };

  // Bonos que el simulador usa al empezar la partida.
  Meta.bonuses = function (s) {
    const L = (id) => Meta.level(s, id), P = D.metaUpgrades;
    return {
      hp: L('hp') * P.hp.per, dmg: L('dmg') * P.dmg.per, speed: L('speed') * P.speed.per,
      magnet: L('magnet') * P.magnet.per, xp: L('xp') * P.xp.per, coin: L('coin') * P.coin.per,
      armor: L('armor') * P.armor.per, regen: L('regen') * P.regen.per,
      rerolls: L('reroll'), revives: L('revive'), choice: L('choice'),
    };
  };

  // ---- Naves ----
  Meta.shipUnlockedByRule = (s, id) => {
    const u = D.ships[id].unlock;
    return !!(u && u.clear && s.cleared[u.clear]);
  };
  Meta.shipOwned = (s, id) => !!s.ships[id] || (D.ships[id].cost === 0 && !D.ships[id].unlock) || Meta.shipUnlockedByRule(s, id);
  Meta.buyShip = function (s, id) {
    const sh = D.ships[id];
    if (!sh || Meta.shipOwned(s, id) || !sh.cost || s.coins < sh.cost) return false;
    s.coins -= sh.cost;
    s.ships[id] = true;
    return true;
  };
  Meta.normalizeOwnership = function (s) {
    for (const id of D.shipOrder) if (Meta.shipOwned(s, id)) s.ships[id] = true;
    if (!s.ships[s.selShip]) s.selShip = 'falcon';
  };
  Meta.maxDiff = (s, stage) => s.diffUnlocked[stage] || 0;
  Meta.stageUnlocked = (s, id) => !D.stages[id].unlock || !!s.cleared[D.stages[id].unlock];

  // ---- Misiones diarias ----
  Meta.ensureDaily = function (s, today) {
    today = today || U.today();
    if (s.missions.day === today && s.missions.list.length) return false;
    const rand = U.rng(U.hash('missions' + today));
    const pool = D.missionTpl.slice();
    const list = [];
    for (let slot = 0; slot < 3; slot++) {
      const tpl = pool.splice(Math.floor(rand() * pool.length), 1)[0];
      list.push({ id: tpl.id, tier: slot, goal: tpl.goals[slot], reward: tpl.reward[slot], progress: 0, claimed: false });
    }
    s.missions = { day: today, list };
    return true;
  };

  // ---- Racha de login ----
  Meta.updateLogin = function (s, today) {
    today = today || U.today();
    if (s.login.last === today) return false;
    const gap = s.login.last ? U.daysBetween(s.login.last, today) : 99;
    s.login.streak = gap === 1 ? s.login.streak + 1 : 1;
    s.login.last = today;
    s.login.claimed = false;
    return true;
  };
  Meta.loginReward = (s) => D.loginRewards[(Math.max(1, s.login.streak) - 1) % D.loginRewards.length];
  Meta.claimLogin = function (s) {
    if (s.login.claimed) return 0;
    s.login.claimed = true;
    const r = Meta.loginReward(s);
    s.coins += r;
    return r;
  };

  // ---- Estadísticas derivadas (para logros) ----
  Meta.statValue = function (s, stat) {
    if (stat === 'shipsOwned') return D.shipOrder.filter((id) => Meta.shipOwned(s, id)).length;
    if (stat === 'metaLevels') return Object.values(s.meta).reduce((a, b) => a + b, 0);
    if (stat.startsWith('win_')) return s.cleared[stat.slice(4)] ? 1 : 0;
    return s.stats[stat] || 0;
  };
  Meta.achProgress = (s, a) => Math.min(a.goal, Meta.statValue(s, a.stat));
  Meta.achReady = (s, a) => !s.ach[a.id] && Meta.statValue(s, a.stat) >= a.goal;
  Meta.claimAch = function (s, id) {
    const a = D.achievements.find((x) => x.id === id);
    if (!a || !Meta.achReady(s, a)) return 0;
    s.ach[id] = true;
    s.coins += a.reward;
    return a.reward;
  };
  Meta.claimMission = function (s, idx) {
    const m = s.missions.list[idx];
    if (!m || m.claimed || m.progress < m.goal) return 0;
    m.claimed = true;
    s.coins += m.reward;
    return m.reward;
  };
  Meta.canAffordUpgrade = (s) => D.metaOrder.some((id) => Meta.level(s, id) < D.metaUpgrades[id].max && s.coins >= D.metaCost(id, Meta.level(s, id)));
  // Cuántas recompensas hay por reclamar (para la insignia del menú).
  Meta.claimable = (s) =>
    s.missions.list.filter((m) => !m.claimed && m.progress >= m.goal).length +
    D.achievements.filter((a) => Meta.achReady(s, a)).length +
    (s.login.claimed ? 0 : 1);

  // ---- Resultado de una partida ----
  // run: { won, time, kills, coins, level, bossKills, stage, ship, maxWeaponLevel }
  Meta.applyRun = function (s, run) {
    const st = s.stats;
    const stage = D.stages[run.stage];
    const dm = D.difficulty[run.difficulty || 0];
    const bonus = run.won ? Math.round(150 * stage.coinMul * dm.coin) : 0;
    let total = Math.round(run.coins) + bonus;
    if (s.stats.runs < D.ASSIST.runs && total < D.ASSIST.minCoins) total = D.ASSIST.minCoins; // suelo para la primera mejora
    const before = D.shipOrder.filter((id) => Meta.shipOwned(s, id));
    st.kills += run.kills; st.runs += 1; st.bossKills += run.bossKills; st.coinsEarned += total;
    st.bestTime = Math.max(st.bestTime, Math.floor(run.time));
    st.maxLevel = Math.max(st.maxLevel, run.level);
    st.maxWeaponLevel = Math.max(st.maxWeaponLevel, run.maxWeaponLevel || 0);
    st.evolved += run.evolved || 0;
    st.playtime += run.time;
    if (run.won) {
      st.wins += 1; s.cleared[run.stage] = true;
      s.diffUnlocked[run.stage] = Math.max(s.diffUnlocked[run.stage] || 0, Math.min(D.difficulty.length - 1, (run.difficulty || 0) + 1));
    }
    const b = s.best[run.stage] || { time: 0, kills: 0, won: false };
    const newBest = run.won ? !b.won || run.time < b.time : (!b.won && run.time > b.time);
    if (newBest) s.best[run.stage] = { time: Math.floor(run.time), kills: run.kills, won: run.won || b.won };
    else if (run.won && !b.won) s.best[run.stage].won = true;
    s.coins += total;
    // misiones
    const day = Meta.ensureDaily(s);
    const vals = { kills: run.kills, coins: total, runs: 1, bossKills: run.bossKills, time: run.time, level: run.level, wins: run.won ? 1 : 0 };
    for (const m of s.missions.list) {
      const tpl = D.missionTpl.find((t) => t.id === m.id);
      if (m.claimed) continue;
      if (tpl.kind === 'sum') m.progress = Math.min(m.goal, m.progress + (vals[tpl.stat] || 0));
      else m.progress = Math.min(m.goal, Math.max(m.progress, Math.floor(vals[tpl.stat] || 0)));
    }
    Meta.normalizeOwnership(s);
    const after = D.shipOrder.filter((id) => Meta.shipOwned(s, id));
    return { total, bonus, newBest, newShips: after.filter((id) => !before.includes(id)) };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/sim.js */
// Simulador de la partida. No toca DOM ni canvas: emite eventos que el render/audio consumen.
(function (g) {
  'use strict';
  const VS = (g.VS = g.VS || {});
  const U = VS.util, D = VS.data;

  const CELL = 64, GW = 44, GH = 44;
  let NID = 1;

  class Sim {
    constructor(cfg) {
      this.rand = cfg.rand || Math.random;
      this.emit = cfg.events !== false;
      this.shipId = cfg.ship;
      this.ship = D.ships[cfg.ship];
      this.stageId = cfg.stage;
      this.stage = D.stages[cfg.stage];
      this.meta = cfg.meta;
      this.viewR = cfg.viewR || 560;
      this.diff = cfg.difficulty || 0;
      this.dm = D.difficulty[this.diff];
      this.assist = !!cfg.assist;
      this.gift = false;
      this.t = 0;
      this.state = 'running'; // running | levelup | dead | won
      this.events = [];
      this.p = { x: 0, y: 0, r: 10, hp: 1, inv: 0, ang: -Math.PI / 2, mx: 0, my: 0, hurt: 0 };
      this.weapons = [];
      this.passives = {};
      this.enemies = []; this.shots = []; this.eshots = []; this.gems = []; this.drops = []; this.rings = [];
      this.level = 1; this.xp = 0; this.xpNeed = D.xpNeed(1); this.pending = 0; this.choices = null;
      this.kills = 0; this.coins = 0; this.bossKills = 0; this.evolved = 0; this.dmgTaken = 0; this.dmgDone = 0;
      this.rerolls = this.meta.rerolls; this.revives = this.meta.revives; this.adRevived = false;
      this.spawnAcc = 0;
      this.eliteT = this.stage.eliteEvery;
      this.ringT = this.stage.swarmEvery;
      this.bossIdx = 0; this.bossAlive = 0;
      this.head = new Int32Array(GW * GH);
      this.nextArr = new Int32Array(1024);
      this.qbuf = []; this.ox = 0; this.oy = 0;
      this.st = {};
      this.recompute();
      this.p.hp = this.st.maxHp;
      for (const id of this.ship.weapons) this.addWeapon(id);
    }

    ev(type, o) {
      if (!this.emit || this.events.length > 400) return;
      o = o || {};
      o.type = type;
      this.events.push(o);
    }

    // ------------------------------------------------------------------ estadísticas
    recompute() {
      const s = this.ship, m = this.meta, ps = this.passives, L = (id) => ps[id] || 0, P = D.passives;
      const st = this.st, oldMax = st.maxHp || 0;
      st.maxHp = s.hp * (1 + m.hp + P.plating.per * L('plating'));
      st.dmg = s.dmg * (1 + m.dmg + P.power.per * L('power'));
      st.cd = Math.max(0.45, 1 - s.cd - P.overclock.per * L('overclock'));
      st.speed = s.speed * (1 + m.speed + P.thrusters.per * L('thrusters'));
      st.magnet = 85 * (1 + s.magnet + m.magnet + P.magnet.per * L('magnet'));
      st.armor = s.armor + m.armor + L('barrier');
      st.xp = 1 + m.xp + P.scholar.per * L('scholar');
      st.coin = 1 + m.coin;
      st.regen = m.regen + P.regen.per * L('regen');
      st.area = 1 + s.area + P.lens.per * L('lens');
      st.pspeed = 1 + 0.08 * L('lens');
      st.crit = s.crit + P.fortune.per * L('fortune');
      st.luck = L('fortune');
      if (oldMax && this.p) this.p.hp += st.maxHp - oldMax; // al subir HP máx se cura la diferencia
    }

    // ------------------------------------------------------------------ cuadrícula espacial
    buildGrid() {
      const p = this.p, E = this.enemies;
      this.ox = p.x - (GW * CELL) / 2;
      this.oy = p.y - (GH * CELL) / 2;
      this.head.fill(-1);
      if (this.nextArr.length < E.length) this.nextArr = new Int32Array(E.length * 2);
      for (let i = 0; i < E.length; i++) {
        const e = E[i];
        if (e.dead) continue;
        const cx = Math.floor((e.x - this.ox) / CELL), cy = Math.floor((e.y - this.oy) / CELL);
        if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) continue;
        const c = cx + cy * GW;
        this.nextArr[i] = this.head[c];
        this.head[c] = i;
      }
      this.gridN = E.length;
    }

    // Rellena this.qbuf con los enemigos cuyo círculo toca (x,y,r). Devuelve cuántos.
    gather(x, y, r) {
      const buf = this.qbuf, E = this.enemies;
      let n = 0;
      const x0 = Math.max(0, Math.floor((x - r - 40 - this.ox) / CELL)), x1 = Math.min(GW - 1, Math.floor((x + r + 40 - this.ox) / CELL));
      const y0 = Math.max(0, Math.floor((y - r - 40 - this.oy) / CELL)), y1 = Math.min(GH - 1, Math.floor((y + r + 40 - this.oy) / CELL));
      for (let cy = y0; cy <= y1; cy++) {
        for (let cx = x0; cx <= x1; cx++) {
          for (let i = this.head[cx + cy * GW]; i !== -1; i = this.nextArr[i]) {
            const e = E[i];
            if (e.dead) continue;
            const dx = e.x - x, dy = e.y - y, rr = r + e.r;
            if (dx * dx + dy * dy < rr * rr) buf[n++] = e;
          }
        }
      }
      return n;
    }

    // Los k enemigos vivos más cercanos al jugador dentro de range.
    nearest(k, range, from) {
      const out = [], d2 = [], E = this.enemies, fx = from ? from.x : this.p.x, fy = from ? from.y : this.p.y;
      const lim = range * range;
      for (let i = 0; i < E.length; i++) {
        const e = E[i];
        if (e.dead) continue;
        const dx = e.x - fx, dy = e.y - fy, raw = dx * dx + dy * dy;
        if (raw > lim) continue;
        const d = raw * (e.boss ? 0.12 : e.elite ? 0.5 : 1); // jefes y élites tienen prioridad de puntería
        let j = out.length;
        if (j < k) { out.push(e); d2.push(d); } else if (d < d2[j - 1]) { j--; out[j] = e; d2[j] = d; } else continue;
        while (j > 0 && d2[j - 1] > d2[j]) {
          [d2[j - 1], d2[j]] = [d2[j], d2[j - 1]];
          [out[j - 1], out[j]] = [out[j], out[j - 1]];
          j--;
        }
      }
      return out;
    }

    // ------------------------------------------------------------------ bucle principal
    update(dt, inp) {
      if (this.state !== 'running') return;
      this.t += dt;
      this.movePlayer(dt, inp);
      this.buildGrid();
      this.director(dt);
      this.updateWeapons(dt);
      this.updateShots(dt);
      this.updateEnemies(dt);
      this.updateEShots(dt);
      this.updatePickups(dt);
      this.updateRings(dt);
      this.sweep();
      if (this.p.hp <= 0 && this.state === 'running') this.die();
      if (this.pending > 0 && this.state === 'running') this.openChoices();
    }

    movePlayer(dt, inp) {
      const p = this.p, st = this.st;
      let ix = inp ? inp.x : 0, iy = inp ? inp.y : 0;
      const mag = Math.hypot(ix, iy);
      if (mag > 1) { ix /= mag; iy /= mag; }
      p.mx = ix; p.my = iy;
      p.x += ix * st.speed * dt;
      p.y += iy * st.speed * dt;
      if (mag > 0.1) {
        let da = Math.atan2(iy, ix) - p.ang;
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        p.ang += da * Math.min(1, dt * 12);
      }
      p.inv = Math.max(0, p.inv - dt);
      p.hurt = Math.max(0, p.hurt - dt);
      if (st.regen > 0 && p.hp < st.maxHp) p.hp = Math.min(st.maxHp, p.hp + st.regen * dt);
    }

    // ------------------------------------------------------------------ director de oleadas
    scale() {
      const tm = this.t / 60, s = this.stage;
      return {
        hp: (1 + D.tune.hpA * tm + D.tune.hpB * tm * tm) * s.hpMul * this.dm.hp * (this.assist ? D.ASSIST.hp : 1),
        dmg: (1 + 0.05 * tm) * s.dmgMul * D.tune.dmg * this.dm.dmg * (this.assist ? D.ASSIST.dmg : 1),
        spd: Math.min(0.3, 0.025 * tm) + s.spdAdd,
      };
    }

    pickType() {
      const t = this.t, w = this.stage.w;
      let tot = 0;
      const cand = [];
      for (const id in D.enemies) {
        const d = D.enemies[id];
        if (d.boss || d.minT > t) continue;
        let wt = d.w * (w[id] || 1);
        if (id === 'swarmer') wt *= Math.max(0.35, 1 - t / 500);
        cand.push([id, wt]);
        tot += wt;
      }
      let r = this.rand() * tot;
      for (const [id, wt] of cand) { r -= wt; if (r <= 0) return id; }
      return 'grunt';
    }

    ringPos(rad) {
      const a = this.rand() * Math.PI * 2, r = rad || this.viewR;
      return { x: this.p.x + Math.cos(a) * r, y: this.p.y + Math.sin(a) * r, a };
    }

    director(dt) {
      const st = this.stage, t = this.t;
      const rate = (st.rate0 + st.rateGrow * (t / 60)) * this.dm.rate * (this.bossAlive ? 0.55 : 1);
      if (this.assist && !this.gift && t >= D.ASSIST.giftAt) { this.gift = true; this.drops.push({ kind: 'chest', x: this.p.x + 70, y: this.p.y - 70 }); }
      this.spawnAcc += rate * dt;
      while (this.spawnAcc >= 1) {
        const type = this.pickType();
        if (this.enemies.length >= st.cap) { this.spawnAcc = Math.min(this.spawnAcc, 2); break; }
        if (type === 'swarmer') {
          const n = 3 + Math.floor(this.rand() * 4), c = this.ringPos();
          for (let i = 0; i < n; i++) this.spawn(type, c.x + (this.rand() - 0.5) * 60, c.y + (this.rand() - 0.5) * 60);
          this.spawnAcc -= n;
        } else {
          const c = this.ringPos();
          this.spawn(type, c.x, c.y);
          this.spawnAcc -= 1;
        }
      }
      if (t >= st.eliteStart) {
        this.eliteT -= dt;
        if (this.eliteT <= 0) {
          this.eliteT = st.eliteEvery;
          let type = this.pickType();
          if (type === 'swarmer') type = 'grunt';
          const c = this.ringPos();
          this.spawn(type, c.x, c.y, { elite: true });
          this.ev('warn', { key: 'elite' });
        }
      }
      if (t >= st.swarmStart) {
        this.ringT -= dt;
        if (this.ringT <= 0) {
          this.ringT = st.swarmEvery;
          const n = 20 + Math.floor(t / 30), rad = this.viewR * 0.95;
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2;
            this.spawn('swarmer', this.p.x + Math.cos(a) * rad, this.p.y + Math.sin(a) * rad);
          }
          this.ev('warn', { key: 'swarm' });
        }
      }
      const b = st.bosses[this.bossIdx];
      if (b && t >= b.t) {
        this.bossIdx++;
        const c = this.ringPos();
        this.spawn(b.type, c.x, c.y, { final: !!b.final });
        this.ev('boss', { id: b.type, final: !!b.final });
      }
    }

    spawn(type, x, y, o) {
      o = o || {};
      const def = D.enemies[type], m = this.scale();
      const elite = !!o.elite, boss = !!def.boss;
      const hpMul = boss ? m.hp * 0.55 + 0.45 : m.hp;
      const hp = def.hp * hpMul * (elite ? 6 : 1);
      const e = {
        id: NID++, type, x, y, r: def.r * (elite ? 1.45 : 1), hp, max: hp,
        speed: def.speed * (1 + m.spd) * (elite ? 0.9 : 1), dmg: def.dmg * m.dmg * (elite ? 1.3 : 1),
        xp: def.xp * (elite ? 6 : 1), beh: def.beh, flash: 0, kx: 0, ky: 0, slow: 0, orbitCd: 0,
        cool: 1 + this.rand() * 2, fire: 1 + this.rand() * 2, st: 0, timer: 0, dx: 0, dy: 0, ph: 0,
        elite, boss, final: !!o.final, dead: false, split: !!def.split, spawnT: 0,
      };
      if (boss) { this.bossAlive++; e.timer = 2; e.cool = 3; }
      this.enemies.push(e);
      return e;
    }

    // ------------------------------------------------------------------ armas
    addWeapon(id) {
      const w = { id, level: 1, cd: 0.2, angle: 0, tick: 0, blades: [] };
      this.weapons.push(w);
      return w;
    }

    updateWeapons(dt) {
      const st = this.st;
      for (const w of this.weapons) {
        const def = D.weapons[w.id], L = def.levels[w.level - 1];
        switch (def.kind) {
          case 'shot': this.wPulse(w, L, dt, st); break;
          case 'orbit': this.wOrbit(w, L, dt, st); break;
          case 'chain': this.wChain(w, L, dt, st); break;
          case 'missile': this.wMissile(w, L, dt, st); break;
          case 'nova': this.wNova(w, L, dt, st); break;
          case 'aura': this.wAura(w, L, dt, st); break;
        }
      }
    }

    wPulse(w, L, dt, st) {
      w.cd -= dt;
      if (w.cd > 0) return;
      const tg = this.nearest(L.n, 520);
      if (!tg.length) { w.cd = 0.1; return; }
      w.cd = L.cd * st.cd;
      const p = this.p;
      for (let k = 0; k < L.n; k++) {
        const e = tg[k % tg.length];
        let a = Math.atan2(e.y - p.y, e.x - p.x);
        if (tg.length < L.n) a += (k - (L.n - 1) / 2) * 0.14;
        const sp = L.spd * st.pspeed;
        this.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, evo: w.level >= 7, r: w.level >= 7 ? 7 : 5, dmg: L.dmg * st.dmg, pierce: L.pierce, life: 1.1, hits: [], kind: 'pulse', color: '#6ff' });
      }
      this.ev('shoot', { k: 'pulse' });
    }

    wOrbit(w, L, dt, st) {
      w.angle += L.spin * dt;
      const R = L.R * st.area, p = this.p, sz = (w.level >= 7 ? 15 : 11) * Math.sqrt(st.area);
      w.blades.length = L.n;
      for (let i = 0; i < L.n; i++) {
        const a = w.angle + (i / L.n) * Math.PI * 2, bx = p.x + Math.cos(a) * R, by = p.y + Math.sin(a) * R;
        w.blades[i] = { x: bx, y: by, r: sz, a };
        const n = this.gather(bx, by, sz);
        for (let j = 0; j < n; j++) {
          const e = this.qbuf[j];
          if (e.orbitCd > 0) continue;
          e.orbitCd = 0.4;
          const kx = Math.cos(a + Math.PI / 2) * 60, ky = Math.sin(a + Math.PI / 2) * 60;
          this.damage(e, L.dmg * st.dmg, kx, ky);
        }
      }
    }

    wChain(w, L, dt, st) {
      w.cd -= dt;
      if (w.cd > 0) return;
      const first = this.nearest(1, 320);
      if (!first.length) { w.cd = 0.1; return; }
      w.cd = L.cd * st.cd;
      const visited = [first[0].id], pts = [{ x: this.p.x, y: this.p.y }];
      let cur = first[0];
      for (let j = 0; j <= L.jumps && cur; j++) {
        pts.push({ x: cur.x, y: cur.y });
        this.damage(cur, L.dmg * st.dmg * (1 - j * 0.04), 0, 0);
        let next = null, nd = Infinity;
        const n = this.gather(cur.x, cur.y, L.range * st.area);
        for (let k = 0; k < n; k++) {
          const e = this.qbuf[k];
          if (visited.includes(e.id)) continue;
          const d = (e.x - cur.x) ** 2 + (e.y - cur.y) ** 2;
          if (d < nd) { nd = d; next = e; }
        }
        if (next) visited.push(next.id);
        cur = next;
      }
      this.ev('bolt', { pts });
    }

    wMissile(w, L, dt, st) {
      w.cd -= dt;
      if (w.cd > 0) return;
      if (!this.enemies.length) { w.cd = 0.2; return; }
      w.cd = L.cd * st.cd;
      const tg = this.nearest(L.n * 2, 600), p = this.p;
      if (!tg.length) { w.cd = 0.2; return; }
      for (let k = 0; k < L.n; k++) {
        const a = p.ang + Math.PI + (k - (L.n - 1) / 2) * 0.6 + (this.rand() - 0.5) * 0.4;
        this.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, r: 6, dmg: L.dmg * st.dmg, pierce: 0, life: 2.8, hits: [], kind: 'missile', aoe: L.aoe * st.area, target: tg[k % tg.length], color: '#f96', ang: a, spd: 250 * st.pspeed });
      }
      this.ev('shoot', { k: 'missile' });
    }

    wNova(w, L, dt, st) {
      w.cd -= dt;
      if (w.cd > 0) return;
      if (!this.enemies.length) { w.cd = 0.3; return; }
      w.cd = L.cd * st.cd;
      this.rings.push({ x: this.p.x, y: this.p.y, r: 8, maxR: L.R * st.area, dmg: L.dmg * st.dmg, knock: L.knock, hit: [], color: '#f6f', cancel: w.level >= 4 });
      this.ev('nova', { x: this.p.x, y: this.p.y });
    }

    wAura(w, L, dt, st) {
      const R = L.R * st.area, p = this.p;
      w.R = R;
      w.tick -= dt;
      const doTick = w.tick <= 0;
      if (doTick) w.tick = L.tick;
      const n = this.gather(p.x, p.y, R);
      for (let i = 0; i < n; i++) {
        const e = this.qbuf[i];
        e.slow = Math.max(e.slow, 0.15);
        if (doTick) this.damage(e, L.dmg * st.dmg, 0, 0, false, true);
      }
    }

    updateRings(dt) {
      const R = this.rings;
      for (let i = R.length - 1; i >= 0; i--) {
        const r = R[i];
        r.r += (r.maxR / 0.55) * dt;
        const n = this.gather(r.x, r.y, r.r + 12);
        for (let j = 0; j < n; j++) {
          const e = this.qbuf[j];
          if (r.hit.includes(e.id)) continue;
          const dx = e.x - r.x, dy = e.y - r.y, d = Math.hypot(dx, dy) || 1;
          if (d + e.r < r.r - 18) continue; // ya quedó dentro del anillo
          r.hit.push(e.id);
          this.damage(e, r.dmg, (dx / d) * r.knock, (dy / d) * r.knock);
        }
        if (r.cancel) {
          for (const b of this.eshots) { if (Math.abs(Math.hypot(b.x - r.x, b.y - r.y) - r.r) < 20) b.life = 0; }
        }
        if (r.r >= r.maxR) R.splice(i, 1);
      }
    }

    // ------------------------------------------------------------------ proyectiles
    updateShots(dt) {
      const S = this.shots;
      for (let i = S.length - 1; i >= 0; i--) {
        const s = S[i];
        s.life -= dt;
        if (s.kind === 'missile') {
          if (!s.target || s.target.dead) { const t = this.nearest(1, 450, s); s.target = t[0] || null; }
          if (s.target) {
            let da = Math.atan2(s.target.y - s.y, s.target.x - s.x) - s.ang;
            while (da > Math.PI) da -= 2 * Math.PI;
            while (da < -Math.PI) da += 2 * Math.PI;
            s.ang += U.clamp(da, -6 * dt, 6 * dt);
          }
          const sp = Math.min(s.spd, Math.hypot(s.vx, s.vy) + 500 * dt);
          s.vx = Math.cos(s.ang) * sp; s.vy = Math.sin(s.ang) * sp;
        }
        s.x += s.vx * dt; s.y += s.vy * dt;
        let remove = s.life <= 0;
        if (!remove) {
          const n = this.gather(s.x, s.y, s.r);
          for (let j = 0; j < n; j++) {
            const e = this.qbuf[j];
            if (s.hits.includes(e.id)) continue;
            if (s.kind === 'missile') { this.explode(s); remove = true; break; }
            s.hits.push(e.id);
            this.damage(e, s.dmg, s.vx * 0.08, s.vy * 0.08);
            if (s.pierce-- <= 0) { remove = true; break; }
          }
        } else if (s.kind === 'missile') this.explode(s);
        if (remove) { S[i] = S[S.length - 1]; S.pop(); }
      }
    }

    explode(s) {
      const n = this.gather(s.x, s.y, s.aoe);
      const list = this.qbuf.slice(0, n);
      for (const e of list) {
        const dx = e.x - s.x, dy = e.y - s.y, d = Math.hypot(dx, dy) || 1;
        this.damage(e, s.dmg, (dx / d) * 120, (dy / d) * 120);
      }
      this.ev('boom', { x: s.x, y: s.y, r: s.aoe, color: '#fa6' });
    }

    updateEShots(dt) {
      const B = this.eshots, p = this.p;
      for (let i = B.length - 1; i >= 0; i--) {
        const b = B[i];
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        let remove = b.life <= 0;
        if (!remove && (b.x - p.x) ** 2 + (b.y - p.y) ** 2 < (b.r + p.r * 0.8) ** 2) { this.hurt(b.dmg); remove = true; }
        if (remove) { B[i] = B[B.length - 1]; B.pop(); }
      }
    }

    shoot(e, ang, speed, dmg, r) {
      this.eshots.push({ x: e.x, y: e.y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r: r || 5, dmg, life: 6 });
    }

    // ------------------------------------------------------------------ enemigos
    updateEnemies(dt) {
      const p = this.p, E = this.enemies;
      const far = this.viewR * 2.2;
      for (let i = 0; i < E.length; i++) {
        const e = E[i];
        if (e.dead) continue;
        let dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
        if (!e.boss && d > far) { const c = this.ringPos(); e.x = c.x; e.y = c.y; continue; }
        e.flash = Math.max(0, e.flash - dt); e.orbitCd -= dt; e.slow -= dt; e.spawnT += dt;
        const nx = dx / d, ny = dy / d;
        let mx = nx, my = ny, mul = e.slow > 0 ? 0.65 : 1;
        switch (e.beh) {
          case 'dash':
            if (e.st === 0) { e.cool -= dt; if (e.cool <= 0 && d < 280) { e.st = 1; e.timer = 0.55; e.dx = nx; e.dy = ny; } }
            else if (e.st === 1) { mul = 0; e.timer -= dt; if (e.timer <= 0) { e.st = 2; e.timer = 0.4; } }
            else { mx = e.dx; my = e.dy; mul = 4.6; e.timer -= dt; if (e.timer <= 0) { e.st = 0; e.cool = 2.4; } }
            break;
          case 'shoot':
            e.fire -= dt;
            if (d < 170) { mx = -nx; my = -ny; mul *= 0.9; } else if (d < 240) { mx = -ny; my = nx; mul *= 0.6; }
            if (e.fire <= 0 && d < 430) { e.fire = 2.6 + this.rand(); this.shoot(e, Math.atan2(dy, dx), 175, e.dmg, 5); }
            break;
          case 'hive':
            if (d < 120) mul = 0.1;
            e.timer -= dt;
            if (e.timer <= 0) {
              e.timer = 2.8 - (e.hp < e.max * 0.5 ? 0.8 : 0);
              for (let k = 0; k < 4; k++) this.spawn('swarmer', e.x + (this.rand() - 0.5) * 60, e.y + (this.rand() - 0.5) * 60);
              this.ev('boom', { x: e.x, y: e.y, r: 50, color: '#8f6' });
            }
            break;
          case 'sentinel':
            if (d < 260) { mx = -nx; my = -ny; mul *= 0.8; } else if (d < 330) { mx = -ny; my = nx; mul *= 0.7; }
            e.timer -= dt; e.cool -= dt;
            if (e.timer <= 0) { // anillo de balas
              e.timer = e.hp < e.max * 0.5 ? 1.9 : 2.5; e.ph++;
              const n = 14, off = (e.ph % 2) * (Math.PI / n);
              for (let k = 0; k < n; k++) this.shoot(e, off + (k / n) * Math.PI * 2, 150, e.dmg * 0.8, 6);
            }
            if (e.cool <= 0) { // ráfaga dirigida
              e.cool = 1.7; const a = Math.atan2(dy, dx);
              for (let k = -1; k <= 1; k++) this.shoot(e, a + k * 0.16, 230, e.dmg, 5);
            }
            break;
          case 'jugg':
            if (e.st === 0) { e.cool -= dt; if (e.cool <= 0) { e.st = 1; e.timer = 0.75; e.dx = nx; e.dy = ny; } }
            else if (e.st === 1) { mul = 0.1; e.timer -= dt; e.dx = nx; e.dy = ny; if (e.timer <= 0) { e.st = 2; e.timer = 0.6; } }
            else {
              mx = e.dx; my = e.dy; mul = 11; e.timer -= dt;
              if (e.timer <= 0) {
                e.st = 0; e.cool = e.hp < e.max * 0.5 ? 2.2 : 3.4;
                if (e.hp < e.max * 0.5) for (let k = 0; k < 12; k++) this.shoot(e, (k / 12) * Math.PI * 2, 170, e.dmg * 0.6, 6);
              }
            }
            break;
        }
        e.kx *= Math.exp(-7 * dt); e.ky *= Math.exp(-7 * dt);
        const kn = e.boss ? 0.12 : 1;
        e.x += (mx * e.speed * mul + e.kx * kn) * dt;
        e.y += (my * e.speed * mul + e.ky * kn) * dt;
        // contacto con el jugador
        const cr = p.r * 0.8 + e.r * 0.85;
        if (d < cr + 6 && p.inv <= 0) { const dd = Math.hypot(p.x - e.x, p.y - e.y); if (dd < cr) this.hurt(e.dmg); }
      }
      // separación suave entre enemigos
      for (let i = 0; i < E.length; i++) {
        const e = E[i];
        if (e.dead || e.boss) continue;
        const n = this.gather(e.x, e.y, e.r);
        for (let j = 0; j < n; j++) {
          const o = this.qbuf[j];
          if (o === e) continue;
          let dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy);
          const min = e.r + o.r;
          if (d >= min) continue;
          if (d < 0.01) { dx = this.rand() - 0.5; dy = this.rand() - 0.5; d = Math.hypot(dx, dy) || 1; }
          const push = (min - d) * (o.boss ? 0.6 : 0.3);
          e.x += (dx / d) * push; e.y += (dy / d) * push;
        }
      }
    }

    // ------------------------------------------------------------------ daño y muertes
    damage(e, dmg, kx, ky, noCrit, quiet) {
      if (e.dead) return;
      let crit = false;
      if (!noCrit && this.rand() < this.st.crit) { dmg *= 2; crit = true; }
      e.hp -= dmg; e.flash = 0.09; e.kx += kx || 0; e.ky += ky || 0;
      this.dmgDone += dmg;
      if (!quiet) this.ev('dmg', { x: e.x, y: e.y - e.r, v: dmg, crit });
      if (e.hp <= 0) this.kill(e);
    }

    kill(e) {
      e.dead = true;
      this.kills++;
      const m = this.stage.coinMul * this.dm.coin * this.st.coin;
      this.ev('kill', { x: e.x, y: e.y, r: e.r, color: D.enemies[e.type].color, boss: e.boss, elite: e.elite });
      this.gems.push({ x: e.x, y: e.y, v: e.xp, pull: false, r: e.xp >= 10 ? 7 : e.xp >= 3 ? 5.5 : 4 });
      if (this.gems.length > 260) { const g0 = this.gems.shift(); this.gems[this.gems.length - 1].v += g0.v; }
      if (e.split) for (let k = 0; k < 2; k++) this.spawn('swarmer', e.x + (this.rand() - 0.5) * 24, e.y + (this.rand() - 0.5) * 24);
      const luck = 1 + this.st.luck * 0.15;
      if (e.boss) {
        this.bossAlive--; this.bossKills++;
        for (let k = 0; k < 14; k++) this.drops.push({ kind: 'coin', x: e.x + (this.rand() - 0.5) * 90, y: e.y + (this.rand() - 0.5) * 90, v: Math.max(1, Math.round(m * 2)) });
        if (e.final) { this.win(); return; }
        this.drops.push({ kind: 'chest', x: e.x, y: e.y });
        this.drops.push({ kind: 'heal', x: e.x + 20, y: e.y });
        this.ev('shake', { v: 0.6 });
      } else if (e.elite) {
        this.drops.push({ kind: 'chest', x: e.x, y: e.y });
        for (let k = 0; k < 4; k++) this.drops.push({ kind: 'coin', x: e.x + (this.rand() - 0.5) * 40, y: e.y + (this.rand() - 0.5) * 40, v: Math.max(1, Math.round(m)) });
      } else {
        const r = this.rand();
        if (r < 0.11 * luck) this.drops.push({ kind: 'coin', x: e.x, y: e.y, v: Math.max(1, Math.round(m)) });
        else if (r < 0.11 * luck + 0.006) this.drops.push({ kind: 'heal', x: e.x, y: e.y });
        else if (r < 0.11 * luck + 0.009) this.drops.push({ kind: 'magnet', x: e.x, y: e.y });
      }
    }

    hurt(dmg) {
      const p = this.p;
      if (p.inv > 0 || this.state !== 'running') return;
      const d = Math.max(dmg * 0.25, dmg - this.st.armor);
      p.hp -= d; p.inv = 0.55; p.hurt = 0.25; this.dmgTaken += d;
      this.ev('hurt', { v: d });
    }

    die() {
      if (this.revives > 0) { this.revives--; this.revive(0.5); this.ev('revive', {}); return; }
      this.state = 'dead';
      this.ev('dead', {});
    }

    revive(frac) {
      const p = this.p;
      p.hp = this.st.maxHp * frac; p.inv = 3;
      this.state = 'running';
      this.eshots.length = 0;
      this.rings.push({ x: p.x, y: p.y, r: 8, maxR: 320, dmg: 9999, knock: 500, hit: [], color: '#fff', cancel: true });
    }

    adRevive() {
      if (this.state !== 'dead' || this.adRevived) return false;
      this.adRevived = true;
      this.revive(0.6);
      this.ev('revive', {});
      return true;
    }

    win() {
      this.state = 'won';
      for (const e of this.enemies) if (!e.dead && !e.boss) e.dead = true;
      this.ev('won', {});
    }

    // ------------------------------------------------------------------ recogidas
    updatePickups(dt) {
      const p = this.p, st = this.st;
      const G = this.gems;
      for (let i = G.length - 1; i >= 0; i--) {
        const gm = G[i];
        const dx = p.x - gm.x, dy = p.y - gm.y, d = Math.hypot(dx, dy) || 1;
        if (d < st.magnet) gm.pull = true;
        if (gm.pull) {
          const sp = 260 + 700 * Math.max(0, 1 - d / 400);
          gm.x += (dx / d) * sp * dt; gm.y += (dy / d) * sp * dt;
        }
        if (d < p.r + gm.r + 5) {
          this.addXp(gm.v * st.xp);
          this.ev('gem', { v: gm.v });
          G[i] = G[G.length - 1]; G.pop();
        }
      }
      const Dr = this.drops;
      for (let i = Dr.length - 1; i >= 0; i--) {

// Entrada: joystick flotante táctil/ratón + teclado (WASD / flechas).
(function (g) {
  'use strict';
  const VS = (g.VS = g.VS || {});
  const keys = {};
  const I = (VS.Input = { x: 0, y: 0, active: false, show: true, ox: 0, oy: 0, max: 58, id: null, fixed: false, enabled: false });

  I.attach = function (el) {
    el.addEventListener('pointerdown', (e) => {
      if (!I.enabled || I.id !== null) return;
      I.id = e.pointerId; I.active = true;
      I.ox = e.clientX; I.oy = e.clientY;
      if (I.fixed) { I.ox = 90; I.oy = g.innerHeight - 110; }
      I.move(e);
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }

    const up = (e) => { if (e.pointerId === I.id) I.release(); };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    g.addEventListener('keydown', (e) => { keys[e.code] = 1; });
    g.addEventListener('keyup', (e) => { keys[e.code] = 0; });

      if (!I.fixed) { I.ox += (dx / d) * (d - I.max); I.oy += (dy / d) * (d - I.max); }
      dx = (dx / d) * I.max; dy = (dy / d) * I.max;

    I.tx = dx / I.max; I.ty = dy / I.max;
    I.x = I.tx; I.y = I.ty;
  };
  I.release = function () { I.id = null; I.active = false; I.x = 0; I.y = 0; };

  I.vector = function () {
    let kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);

    const m = Math.hypot(I.x, I.y);
    if (m < 0.12) return { x: 0, y: 0 };
    return { x: I.x, y: I.y };
  };

    // ---- efectos a partir de eventos de la simulación ----

        if ((P.mx || P.my) && Math.random() < 0.7) this.parts.push({ x: P.x - Math.cos(P.ang) * 10, y: P.y - Math.sin(P.ang) * 10, vx: -P.mx * 40, vy: -P.my * 40, life: 0.25, max: 0.25, size: 2.2, color: '#fa5' });

        const gr = c.createRadialGradient(sim.p.x, sim.p.y, w.R * 0.2, sim.p.x, sim.p.y, w.R);
        gr.addColorStop(0, 'rgba(100,255,160,.02)'); gr.addColorStop(1, 'rgba(100,255,160,.22)');

      }
