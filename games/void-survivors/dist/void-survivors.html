      const P = sim.p;
      for (const e of sim.enemies) {
        if (!vis(e.x, e.y)) continue;
        const sp = this.spr(e), img = e.flash > 0 ? sp.f : sp.n;
        const rot = ROT[D.enemies[e.type].shape];
        const a = rot ? (e.st === 2 && e.beh === 'dash' ? Math.atan2(e.dy, e.dx) : Math.atan2(P.y - e.y, P.x - e.x)) + Math.PI / 2 : 0;
        const sc = e.beh === 'dash' && e.st === 1 ? 1 + Math.sin(this.t * 40) * 0.12 : 1;
        c.save(); c.translate(e.x, e.y); if (rot) c.rotate(a);
        c.drawImage(img.c, -img.half * sc, -img.half * sc, img.half * 2 * sc, img.half * 2 * sc);
        c.restore();
        if (e.elite && !e.boss && e.hp < e.max) this.hpBar(c, e.x, e.y - e.r - 6, e.r * 2, e.hp / e.max, '#fc4');
        if (e.beh === 'dash' && e.st === 1) { c.strokeStyle = 'rgba(255,255,80,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(e.x, e.y); c.lineTo(e.x + e.dx * 220, e.y + e.dy * 220); c.stroke(); }
        if (e.beh === 'jugg' && e.st === 1) { c.strokeStyle = 'rgba(255,60,60,.55)'; c.lineWidth = 6; c.beginPath(); c.moveTo(e.x, e.y); c.lineTo(e.x + e.dx * 380, e.y + e.dy * 380); c.stroke(); }
      }
      // disparos enemigos
      const bs = this.simple('eb', (cc, r, col) => { cc.beginPath(); cc.arc(0, 0, r, 0, TAU); cc.fillStyle = col; cc.fill(); cc.fillStyle = '#fff'; cc.beginPath(); cc.arc(0, 0, r * 0.45, 0, TAU); cc.fill(); }, 5, '#f4a', 8);
      for (const b of sim.eshots) if (vis(b.x, b.y)) { const k = b.r / 5; c.drawImage(bs.c, b.x - bs.half * k, b.y - bs.half * k, bs.half * 2 * k, bs.half * 2 * k); }
      // armas orbitales
      for (const w of sim.weapons) if (w.id === 'orbit') for (const b of w.blades) {
        c.save(); c.translate(b.x, b.y); c.rotate(b.a * 3);
        const evo = w.level >= 7; c.fillStyle = evo ? '#fff' : '#fd5'; c.shadowColor = evo ? '#f90' : '#fd5'; c.shadowBlur = 10;
        c.beginPath(); c.moveTo(0, -b.r * 1.3); c.lineTo(b.r * 0.55, 0); c.lineTo(0, b.r * 1.3); c.lineTo(-b.r * 0.55, 0); c.closePath(); c.fill();
        c.restore();
      }
      c.shadowBlur = 0;
      // disparos propios
      for (const s of sim.shots) {
        if (!vis(s.x, s.y)) continue;
        if (s.kind === 'pulse') { c.save(); c.translate(s.x, s.y); c.rotate(Math.atan2(s.vy, s.vx)); const k = s.evo ? 1.5 : 1; c.fillStyle = s.evo ? '#fff' : '#7ff'; c.shadowColor = s.evo ? '#fd5' : '#6ff'; c.shadowBlur = 8; c.beginPath(); c.roundRect(-8 * k, -2.2 * k, 16 * k, 4.4 * k, 2); c.fill(); c.restore(); }
        else { c.save(); c.translate(s.x, s.y); c.rotate(s.ang); c.fillStyle = '#fb7'; c.shadowColor = '#f94'; c.shadowBlur = 8; c.beginPath(); c.moveTo(8, 0); c.lineTo(-6, -4.5); c.lineTo(-3, 0); c.lineTo(-6, 4.5); c.closePath(); c.fill(); c.restore(); }
      }
      c.shadowBlur = 0;
      // rayos
      for (const b of this.bolts) {
        c.globalAlpha = 1 - b.t / 0.25; c.strokeStyle = '#bdf'; c.shadowColor = '#9bf'; c.shadowBlur = 12; c.lineWidth = 3;
        c.beginPath();
        b.pts.forEach((p, i) => {
          if (i === 0) { c.moveTo(p.x, p.y); return; }
          const q = b.pts[i - 1], n = 4;
          for (let k = 1; k <= n; k++) { const f = k / n, jx = k < n ? (Math.random() - 0.5) * 14 : 0, jy = k < n ? (Math.random() - 0.5) * 14 : 0; c.lineTo(q.x + (p.x - q.x) * f + jx, q.y + (p.y - q.y) * f + jy); }
        });
        c.stroke(); c.shadowBlur = 0; c.globalAlpha = 1;
      }
      // explosiones
      for (const b of this.booms) {
        const k = b.t / b.max; c.globalAlpha = (1 - k) * 0.7; c.fillStyle = b.color;
        c.beginPath(); c.arc(b.x, b.y, b.r * (0.4 + 0.6 * k), 0, TAU); c.fill(); c.globalAlpha = 1;
      }
      // jugador
      if (sim.state !== 'dead' && !(opts && opts.menu)) this.drawPlayer(c, sim);
      // partículas
      for (const p of this.parts) { c.globalAlpha = Math.max(0, p.life / p.max); c.fillStyle = p.color; c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
      c.globalAlpha = 1;
      // números de daño
      c.textAlign = 'center';
      for (const t of this.texts) {
        c.globalAlpha = 1 - t.t / 0.7; c.font = `800 ${t.crit ? 15 : 11}px system-ui,sans-serif`;
        c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.6)'; c.fillStyle = t.crit ? '#ffd24a' : '#fff';
        const y = t.y - t.t * 30; c.strokeText(t.v, t.x, y); c.fillText(t.v, t.x, y);
      }
      c.globalAlpha = 1;
      c.restore();

      // viñeta de daño
      if (this.vig > 0) {
        const gr = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) / 2);
        gr.addColorStop(0, 'rgba(255,0,0,0)'); gr.addColorStop(1, `rgba(255,30,30,${this.vig})`);
        c.fillStyle = gr; c.fillRect(0, 0, W, H);
      }
      // flecha hacia el jefe fuera de pantalla + barra de vida
      const boss = sim.enemies.find((e) => e.boss);
      if (boss) this.drawBoss(c, sim, boss);
      // banners (apilados; el texto se ajusta al ancho de la pantalla)
      this.banners.forEach((b, i) => {
        const k = b.t / b.max, a = k < 0.15 ? k / 0.15 : k > 0.75 ? (1 - k) / 0.25 : 1;
        c.globalAlpha = Math.max(0, a); c.textAlign = 'center'; c.fillStyle = b.col; c.strokeStyle = 'rgba(0,0,0,.7)'; c.lineWidth = 6;
        let size = Math.min(W * 0.1, 44) * b.size;
        c.font = `900 ${size}px system-ui,sans-serif`;
        const tw = c.measureText(b.txt).width;
        if (tw > W * 0.92) { size *= (W * 0.92) / tw; c.font = `900 ${size}px system-ui,sans-serif`; }
        const y = H * 0.27 + i * Math.min(W * 0.12, 54) + (1 - Math.min(1, k * 6)) * 16;
        c.strokeText(b.txt, W / 2, y); c.fillText(b.txt, W / 2, y); c.globalAlpha = 1;
      });
      // joystick
      if (input && input.active && input.show) {
        c.globalAlpha = 0.35; c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(input.ox, input.oy, input.max, 0, TAU); c.stroke();
        c.globalAlpha = 0.6; c.fillStyle = '#fff'; c.beginPath(); c.arc(input.ox + input.x * input.max, input.oy + input.y * input.max, input.max * 0.38, 0, TAU); c.fill(); c.globalAlpha = 1;
      }
    }

    drawGrid(c, st, z) {
      const s = 120, x0 = Math.floor((this.cam.x - this.W / z / 2) / s) * s, x1 = this.cam.x + this.W / z / 2;
      const y0 = Math.floor((this.cam.y - this.H / z / 2) / s) * s, y1 = this.cam.y + this.H / z / 2;
      c.strokeStyle = st.grid; c.globalAlpha = 0.5; c.lineWidth = 1 / z * 1.2; c.beginPath();
      for (let x = x0; x <= x1; x += s) { c.moveTo(x, y0); c.lineTo(x, y1 + s); }
      for (let y = y0; y <= y1; y += s) { c.moveTo(x0, y); c.lineTo(x1 + s, y); }
      c.stroke(); c.globalAlpha = 1;
    }

    hpBar(c, x, y, w, f, col) {
      c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(x - w / 2, y, w, 3);
      c.fillStyle = col; c.fillRect(x - w / 2, y, w * Math.max(0, f), 3);
    }

    drawDrop(c, d) {
      const b = Math.sin(this.t * 6 + d.x) * 1.2;
      if (d.kind === 'coin') { c.fillStyle = '#fc3'; c.shadowColor = '#fc3'; c.shadowBlur = 8; c.beginPath(); c.arc(d.x, d.y + b, 5, 0, TAU); c.fill(); c.shadowBlur = 0; c.fillStyle = '#a70'; c.beginPath(); c.arc(d.x, d.y + b, 2.4, 0, TAU); c.fill(); }
      else if (d.kind === 'heal') { c.fillStyle = '#4f7'; c.shadowColor = '#4f7'; c.shadowBlur = 10; c.fillRect(d.x - 7, d.y - 2.5 + b, 14, 5); c.fillRect(d.x - 2.5, d.y - 7 + b, 5, 14); c.shadowBlur = 0; }
      else if (d.kind === 'magnet') { c.strokeStyle = '#f5f'; c.shadowColor = '#f5f'; c.shadowBlur = 10; c.lineWidth = 4; c.beginPath(); c.arc(d.x, d.y + b, 6, Math.PI, 0); c.moveTo(d.x - 6, d.y + b); c.lineTo(d.x - 6, d.y + b + 6); c.moveTo(d.x + 6, d.y + b); c.lineTo(d.x + 6, d.y + b + 6); c.stroke(); c.shadowBlur = 0; }
      else if (d.kind === 'chest') { c.fillStyle = '#fc3'; c.shadowColor = '#fc3'; c.shadowBlur = 14; c.fillRect(d.x - 11, d.y - 8 + b, 22, 16); c.shadowBlur = 0; c.fillStyle = '#a60'; c.fillRect(d.x - 11, d.y - 2 + b, 22, 3); c.fillStyle = '#fff'; c.fillRect(d.x - 2, d.y - 3 + b, 4, 6); }
    }

    drawPlayer(c, sim) {
      const P = sim.p, s = this.shipSpr(sim.shipId);
      if (P.inv > 0 && Math.floor(this.t * 16) % 2 === 0 && P.inv < 3) c.globalAlpha = 0.45;
      c.save(); c.translate(P.x, P.y); c.rotate(P.ang + Math.PI / 2);
      c.drawImage(s.c, -s.half, -s.half, s.half * 2, s.half * 2);
      c.restore(); c.globalAlpha = 1;
      // radio de recogida muy tenue
      if (sim.state === 'running') { c.strokeStyle = 'rgba(255,255,255,.04)'; c.lineWidth = 1; c.beginPath(); c.arc(P.x, P.y, sim.st.magnet, 0, TAU); c.stroke(); }
    }

    drawBoss(c, sim, b) {
      const W = this.W, z = this.zoom, bw = Math.min(W * 0.8, 380), x = W / 2 - bw / 2, y = this.H - 46 - 22;
      c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(x - 2, y - 2, bw + 4, 14);
      c.fillStyle = '#f44'; c.fillRect(x, y, bw * Math.max(0, b.hp / b.max), 10);
      c.fillStyle = '#fff'; c.font = '700 12px system-ui'; c.textAlign = 'center'; c.fillText(VS.t('boss.' + b.type).toUpperCase(), W / 2, y - 7);
      const sx = (b.x - this.cam.x) * z + W / 2, sy = (b.y - this.cam.y) * z + this.H / 2;
      if (sx < 20 || sx > W - 20 || sy < 20 || sy > this.H - 20) { // flecha en el borde
        const a = Math.atan2(sy - this.H / 2, sx - W / 2), m = 34, ex = U.clamp(W / 2 + Math.cos(a) * 1e4, m, W - m), ey = U.clamp(this.H / 2 + Math.sin(a) * 1e4, m + 70, this.H - m - 40);
        c.save(); c.translate(ex, ey); c.rotate(a); c.fillStyle = '#f44'; c.shadowColor = '#f44'; c.shadowBlur = 10;
        c.beginPath(); c.moveTo(14, 0); c.lineTo(-8, -10); c.lineTo(-8, 10); c.closePath(); c.fill(); c.restore();
      }
    }
  }
  const ROT = { tri: 1, cannon: 1, sentinel: 1, jugg: 1 };

  VS.Renderer = Renderer;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/ui.js */
// Pantallas de menú y diálogos (DOM). Toda la lógica de negocio vive en Meta/App; aquí solo se pinta.
(function (g) {
  'use strict';
  const VS = (g.VS = g.VS || {});
  const D = VS.data, M = VS.Meta, U = VS.util, t = (k, v) => VS.t(k, v), ic = (id, col, cls) => VS.iconImg(id, col, cls);

  const UI = (VS.UI = { toastT: 0 });
  const $ = (s) => g.document.querySelector(s);

  UI.show = (html, cls) => { $('#screen').innerHTML = `<div class="scr ${cls || 'bg'}">${html}</div>`; };
  UI.clear = () => { $('#screen').innerHTML = ''; };
  UI.toast = function (msg) {
    const el = $('#toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(UI.toastT);
    UI.toastT = setTimeout(() => el.classList.remove('on'), 1800);
  };
  const streakTxt = (n) => (n === 1 ? t('login_streak1') : t('login_streak', { n }));
  const coinPill = (s) => `<span class="pill">${ic('coin', '#fc3')}<span id="coinv">${U.fmtNum(s.coins)}</span></span>`;
  const topbar = (s, title) => `<div class="topbar"><button class="btn small" data-a="home">‹ ${t('back')}</button><h2 class="title">${title}</h2>${coinPill(s)}</div>`;

  // ---------------------------------------------------------------- inicio
  UI.home = function (s, shipImg) {
    const stage = D.stages[s.selStage], ship = D.ships[s.selShip], sid = s.selStage;
    const idx = D.stageOrder.indexOf(sid), unlocked = M.stageUnlocked(s, sid);
    const best = s.best[sid];
    const bestTxt = best ? `${t('best')}: ${U.fmtTime(best.time)}${best.won ? ' ✓' : ''}` : '';
    const claim = M.claimable(s);
    UI.show(`
      <div class="home wrap" style="align-items:center">
        ${coinPill(s)}
        <button class="btn small gear iconbtn" data-a="settings" aria-label="${t('settings')}">${ic('gear', '#fff')}</button>
        <h1 class="logo">VOID<br>SURVIVORS</h1>
        <p class="tag">${t('app.tag')}</p>
        <div class="shipshow"><img src="${shipImg}" alt=""></div>
        <div class="name" style="text-align:center">${t('sh.' + s.selShip + '.n')}</div>
        <div class="stagesel">
          <button class="btn arrow" data-a="stage" data-v="-1" ${idx === 0 ? 'disabled' : ''}>‹</button>
          <div class="card">
            <b>${t('stage')} ${idx + 1}: ${t('st.' + sid + '.n')}</b>
            <small>${unlocked ? bestTxt || t('st.' + sid + '.d') : ic('lock', '#fff') + ' ' + t('unlock_stage')}</small>
          </div>
          <button class="btn arrow" data-a="stage" data-v="1" ${idx === D.stageOrder.length - 1 ? 'disabled' : ''}>›</button>
        </div>
        <div class="seg diffseg">${D.difficulty.map((_, d) => {
          const ok = unlocked && d <= M.maxDiff(s, sid);
          return `<button class="btn ${s.selDiff === d && ok ? 'on' : ''} ${ok ? '' : 'off'}" data-a="diff" data-v="${d}">${ok ? '' : ic('lock', '#fff') + ' '}${t('diff.' + d)}</button>`;
        }).join('')}</div>
        <button class="btn big play ${unlocked ? '' : 'off'}" data-a="play">${t('play')}</button>
        <div class="nav">
          <button class="btn" data-a="ships">${ic('ship', '#5df')}${t('ships')}</button>
          <button class="btn" data-a="upgrades">${ic('up', '#6f9')}${t('upgrades')}${M.canAffordUpgrade(s) ? '<span class="badge">!</span>' : ''}</button>
          <button class="btn" data-a="missions">${ic('mission', '#fc3')}${t('missions')}${claim ? `<span class="badge">${claim}</span>` : ''}</button>
          <button class="btn" data-a="trophies">${ic('trophy', '#f9f')}${t('trophies')}</button>
        </div>
      </div>`);
  };

  // ---------------------------------------------------------------- naves
  UI.ships = function (s, shipImgs) {
    const rows = D.shipOrder.map((id) => {
      const sh = D.ships[id], owned = M.shipOwned(s, id), sel = s.selShip === id;
      const w0 = sh.weapons.map((w) => ic(w, D.weapons[w].color)).join('');
      let action;
      if (sel) action = `<span class="pill" style="color:var(--good)">${ic('check', '#5f9')} ${t('selected')}</span>`;
      else if (owned) action = `<button class="btn small" data-a="selship" data-v="${id}">${t('select')}</button>`;
      else if (sh.unlock) action = `<span class="desc">${ic('lock', '#fff')} ${t('unlock_clear', { s: t('st.' + sh.unlock.clear + '.n') })}</span>`;
      else action = `<button class="btn small gold ${s.coins >= sh.cost ? '' : 'off'}" data-a="buyship" data-v="${id}">${ic('coin', '#620')} ${U.fmtNum(sh.cost)}</button>`;
      const bar = (v, max) => `<div class="bar"><i style="width:${Math.min(100, (v / max) * 100)}%"></i></div>`;
      return `<div class="card ${sel ? 'sel' : ''} ${owned ? '' : 'lockedc'}">
        <div class="row"><div class="ico"><img src="${shipImgs[id]}" alt="" style="width:46px;height:46px"></div>
          <div class="grow"><div class="name">${t('sh.' + id + '.n')}</div><div class="desc">${t('sh.' + id + '.d')}</div></div></div>
        <div class="stats3"><span>${t('stat.hp')}</span>${bar(sh.hp, 170)}<span>${t('stat.speed')}</span>${bar(sh.speed, 190)}<span>${t('stat.armor')}</span>${bar(sh.armor, 4)}</div>
        <div class="row" style="margin-top:10px"><span class="desc">${t('start_weapon')}: ${w0}</span><span style="flex:1"></span>${action}</div>
      </div>`;
    }).join('');
    UI.show(`<div class="wrap">${topbar(s, t('ships'))}<div class="list">${rows}</div></div>`);
  };

  // ---------------------------------------------------------------- mejoras permanentes
  const ICONS = { hp: ['plating', '#9d6'], dmg: ['power', '#f66'], speed: ['thrusters', '#4cf'], magnet: ['magnet', '#c8f'], xp: ['scholar', '#6fd'], coin: ['coin', '#fc3'], armor: ['barrier', '#8af'], regen: ['regen', '#f9a'], reroll: ['lens', '#fa6'], revive: ['heart', '#f66'], choice: ['fortune', '#ff6'] };
  UI.upgrades = function (s) {
    const rows = D.metaOrder.map((id) => {
      const u = D.metaUpgrades[id], lv = M.level(s, id), maxed = lv >= u.max, cost = D.metaCost(id, lv);
      const pips = Array.from({ length: u.max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('');
      const btn = maxed ? `<span class="pill" style="color:var(--good)">${t('max')}</span>` : `<button class="btn small gold ${s.coins >= cost ? '' : 'off'}" data-a="buyupg" data-v="${id}">${ic('coin', '#620')} ${U.fmtNum(cost)}</button>`;
      return `<div class="card row"><div class="ico">${ic(ICONS[id][0], ICONS[id][1])}</div>
        <div class="grow"><div class="name">${t('u.' + id + '.n')}</div><div class="desc">${t('u.' + id + '.d')}</div><div class="pips">${pips}</div></div>${btn}</div>`;
    }).join('');
    UI.show(`<div class="wrap">${topbar(s, t('upgrades'))}<div class="list">${rows}</div></div>`);
  };

  // ---------------------------------------------------------------- misiones
  UI.missions = function (s) {
    const L = D.loginRewards, streakDay = ((Math.max(1, s.login.streak) - 1) % L.length);
    const days = L.map((r, i) => `<div class="day ${i < streakDay || (i === streakDay && s.login.claimed) ? 'past' : ''} ${i === streakDay ? 'today' : ''}">${t('login_day', { n: i + 1 })}<b>${ic('coin', '#fc3')} ${r}</b></div>`).join('');
    const login = `<div class="card"><div class="row"><div class="grow"><div class="name">${t('daily_login')}</div><div class="desc">${streakTxt(s.login.streak)}</div></div>
      ${s.login.claimed ? `<span class="pill" style="color:var(--good)">${ic('check', '#5f9')}</span>` : `<button class="btn gold" data-a="claimlogin">${t('collect')} +${M.loginReward(s)}</button>`}</div>
      <div class="sp"></div><div class="streak">${days}</div></div>`;
    const ms = s.missions.list.map((m, i) => {
      const done = m.progress >= m.goal, tpl = D.missionTpl.find((x) => x.id === m.id);
      const goalTxt = m.id === 'time' ? U.fmtTime(m.goal) : m.goal;
      const act = m.claimed ? `<span class="pill" style="color:var(--dim)">${t('claimed')}</span>` : done ? `<button class="btn small gold" data-a="claimmission" data-v="${i}">${t('claim')} +${m.reward}</button>` : `<span class="pill">${ic('coin', '#fc3')} ${m.reward}</span>`;
      const prog = m.id === 'time' ? U.fmtTime(m.progress) : m.progress;
      return `<div class="card"><div class="row"><div class="grow"><div class="name">${t('m.' + m.id, { n: goalTxt })}</div>
        <div class="desc">${prog} / ${goalTxt}</div><div class="sp"></div><div class="bar ${done ? 'done' : ''}"><i style="width:${Math.min(100, (m.progress / m.goal) * 100)}%"></i></div></div>${act}</div></div>`;
    }).join('');
    UI.show(`<div class="wrap">${topbar(s, t('missions'))}${login}<div class="name" style="margin-top:6px">${t('daily')} <span class="desc">· ${t('resets')}</span></div>${ms}</div>`);
  };

  // ---------------------------------------------------------------- logros
  UI.trophies = function (s) {
    const list = D.achievements.slice().sort((a, b) => (s.ach[a.id] ? 1 : 0) - (s.ach[b.id] ? 1 : 0) || (M.achReady(s, b) ? 1 : 0) - (M.achReady(s, a) ? 1 : 0));
    const rows = list.map((a) => {
      const v = M.achProgress(s, a), ready = M.achReady(s, a), done = !!s.ach[a.id];
      const act = done ? `<span class="pill" style="color:var(--good)">${ic('check', '#5f9')}</span>` : ready ? `<button class="btn small gold" data-a="claimach" data-v="${a.id}">${t('claim')} +${a.reward}</button>` : `<span class="pill">${ic('coin', '#fc3')} ${a.reward}</span>`;
      const fmt = a.stat === 'bestTime' ? U.fmtTime : (x) => U.fmtNum(x);
      return `<div class="card ${done ? 'lockedc' : ''}"><div class="row"><div class="ico">${ic('trophy', done ? '#5f9' : '#f9f')}</div>
        <div class="grow"><div class="name">${t('a.' + a.id)}</div><div class="desc">${t('a.' + a.id + '.d')}</div><div class="sp"></div>
        <div class="bar ${done || ready ? 'done' : ''}"><i style="width:${(v / a.goal) * 100}%"></i></div><div class="desc">${fmt(v)} / ${fmt(a.goal)}</div></div>${act}</div></div>`;
    }).join('');
    UI.show(`<div class="wrap">${topbar(s, t('trophies'))}<div class="list">${rows}</div></div>`);
  };

  // ---------------------------------------------------------------- ajustes
  UI.settings = function (s, privacyUrl) {
    const st = s.settings, sw = (k, label) => `<div class="switch"><span>${label}</span><button class="tog ${st[k] ? 'on' : ''}" data-a="tog" data-v="${k}" aria-label="${label}"></button></div>`;
    const S = s.stats;
    UI.show(`<div class="wrap">${topbar(s, t('settings'))}
      <div class="card">${sw('sound', t('sound'))}${sw('music', t('music'))}${sw('vibe', t('vibration'))}${sw('shake', t('shake'))}${sw('numbers', t('numbers'))}
        <div class="switch"><span>${t('language')}</span><div class="seg"><button class="btn ${VS.i18n.lang === 'es' ? 'on' : ''}" data-a="lang" data-v="es">ES</button><button class="btn ${VS.i18n.lang === 'en' ? 'on' : ''}" data-a="lang" data-v="en">EN</button></div></div></div>
      <div class="card"><div class="name">${t('stats')}</div><div class="res">
        <span>${t('total_runs')}</span><span>${S.runs}</span><span>${t('total_wins')}</span><span>${S.wins}</span><span>${t('total_kills')}</span><span>${U.fmtNum(S.kills)}</span>
        <span>${t('play_time')}</span><span>${Math.floor(S.playtime / 60)} min</span></div></div>
      <button class="btn ghost" data-a="url" data-v="${privacyUrl}">${t('privacy')}</button>
      <button class="btn red" data-a="reset">${t('reset')}</button>
      <div class="desc" style="text-align:center">v${VS.VERSION || '1.0.0'}</div></div>`);
  };

  // ---------------------------------------------------------------- subida de nivel
  function diffText(id, level) {
    const L = D.weapons[id].levels, a = L[level - 2], b = L[level - 1], out = [];
    for (const k in b) {
      if (a[k] === b[k] || !(('stat.' + k) in VS.i18nDict.en)) continue;
      const f = (v) => (k === 'cd' || k === 'tick' || k === 'spin' ? v.toFixed(2).replace(/0$/, '') : Math.round(v));
      out.push(`${t('stat.' + k)} ${f(a[k])}→${f(b[k])}`);
    }
    return out.slice(0, 3).join(' · ');
  }
  UI.levelup = function (sim) {
    const cards = sim.choices.map((c, i) => {
      let icon, name, tag = '', desc;
      if (c.kind === 'weapon' && c.evo) { const def = D.weapons[c.id]; icon = ic(c.id, '#ffd24a'); name = t('w.' + c.id + '.evo'); tag = `<span class="tagnew" style="color:#fc3">${t('evolution')}</span>`; desc = diffText(c.id, c.level); }
      else if (c.kind === 'weapon') { const def = D.weapons[c.id]; icon = ic(c.id, def.color); name = t('w.' + c.id + '.n'); tag = c.level === 1 ? `<span class="tagnew">${t('stat.new')}</span>` : `<span class="lvl">${t('level')} ${c.level}${c.level === def.max ? ' · ' + t('max') : ''}</span>`; desc = c.level === 1 ? t('w.' + c.id + '.d') : diffText(c.id, c.level); }
      else if (c.kind === 'passive') { const def = D.passives[c.id]; icon = ic(c.id, def.color); name = t('p.' + c.id + '.n'); tag = `<span class="lvl">${t('level')} ${c.level}${c.level === def.max ? ' · ' + t('max') : ''}</span>`; desc = t('p.' + c.id + '.d'); }
      else if (c.kind === 'heal') { icon = ic('heart', '#f66'); name = t('heal'); desc = t('heal.d'); }
      else { icon = ic('coin', '#fc3'); name = t('bonus_coins'); desc = t('coins.d'); }
      return `<button class="choice ${c.kind}${c.evo ? ' evo' : ''}" data-a="choose" data-v="${i}"><div class="ico">${icon}</div><div class="grow"><div class="name">${name} ${tag}</div><div class="desc">${desc}</div></div></button>`;
    }).join('');
    const rr = sim.rerolls > 0 ? `<button class="btn" data-a="reroll">${ic('lens', '#fa6')} ${t('reroll')} (${sim.rerolls})</button>` : '';
    UI.show(`<div class="wrap" style="margin:auto 0"><h3 class="lv-title">${t('levelup')}</h3><p class="lv-sub">${t('choose_upgrade')}</p>${cards}<div style="text-align:center">${rr}</div></div>`, 'dim');
  };

  // ---------------------------------------------------------------- pausa
  UI.pause = function (sim, s) {
    const st = s.settings, tog = (k, l) => `<div class="switch"><span>${l}</span><button class="tog ${st[k] ? 'on' : ''}" data-a="tog" data-v="${k}" data-r="pause"></button></div>`;
    const items = sim.weapons.map((w) => `<div class="row">${ic(w.id, D.weapons[w.id].color)}<span class="grow">${t('w.' + w.id + (w.level >= 7 ? '.evo' : '.n'))}</span><b>${t('level')} ${w.level}</b></div>`).join('') +
      Object.keys(sim.passives).map((id) => `<div class="row">${ic(id, D.passives[id].color)}<span class="grow">${t('p.' + id + '.n')}</span><b>${t('level')} ${sim.passives[id]}</b></div>`).join('');
    UI.show(`<div class="wrap" style="margin:auto 0"><h3 class="lv-title" style="color:#fff">${t('pause')}</h3>
      <div class="card">${items}</div><div class="card">${tog('sound', t('sound'))}${tog('music', t('music'))}</div>
      <button class="btn big play" data-a="resume">${t('resume')}</button><button class="btn red" data-a="quit">${t('quit')}</button></div>`, 'dim');
  };

  // ---------------------------------------------------------------- revivir (anuncio) y resultados
  UI.revive = function (canAd) {
    UI.show(`<div class="wrap" style="margin:auto 0;text-align:center"><div class="big-num lose">${t('defeat')}</div><div class="sp"></div>
      ${canAd ? `<button class="btn big gold" data-a="revivead">${ic('ad', '#310')} ${t('revive_ad')}</button>` : ''}
      <button class="btn big" data-a="giveup">${t('continue')}</button></div>`, 'dim');
  };

  UI.results = function (s, run, sum, adOk, flags) {
    flags = flags || {};
    const won = run.won, unlocks = sum.newShips.map((id) => `<div class="newb">${t('new_unlock')}: ${t('sh.' + id + '.n')}</div>`).join('');
    UI.show(`<div class="wrap" style="margin:auto 0"><div class="big-num ${won ? 'win' : 'lose'}">${won ? t('victory') : t('defeat')}</div>
      ${sum.newBest ? `<div class="newb">${t('new_best')}</div>` : ''}${unlocks}
      <div class="card"><div class="res"><span>${t('stage')}</span><span>${t('st.' + run.stage + '.n')}</span><span>${t('time')}</span><span>${U.fmtTime(run.time)}</span>
        <span>${t('kills')}</span><span>${run.kills}</span><span>${t('level')}</span><span>${run.level}</span>
        ${won ? `<span>${t('win_bonus')}</span><span>+${sum.bonus}</span>` : ''}
        <span>${t('coins_earned')}</span><span style="color:var(--gold)" id="gained">+${sum.total}</span></div></div>
      ${flags.upgradeCta ? `<button class="btn big gold cta" data-a="upgrades">${ic('up', '#310')} ${t('upgrade_cta')}</button>` : ''}
      ${flags.askRate ? `<div class="card"><div class="name">${t('rate_title')}</div><div class="desc">${t('rate_d')}</div><div class="sp"></div><div class="row"><button class="btn gold small" data-a="rate">${t('rate_btn')}</button><button class="btn ghost small" data-a="ratelater">${t('later')}</button></div></div>` : ''}
      ${adOk ? `<button class="btn gold" data-a="doublead" id="dblbtn">${ic('ad', '#310')} ${t('double_ad')}</button>` : ''}
      <div class="row" style="justify-content:center"><button class="btn big play" data-a="play" style="min-width:0">${t('retry')}</button><button class="btn big" data-a="home">${t('home')}</button></div></div>`, 'dim');
  };

  // Ventana de recompensa diaria al abrir la app.
  UI.loginPopup = function (s) {
    UI.show(`<div class="wrap" style="margin:auto 0;text-align:center"><h3 class="lv-title">${t('daily_login')}</h3>
      <div class="card"><div class="desc">${streakTxt(s.login.streak)}</div><div class="big-num" style="color:var(--gold);margin:10px 0">+${M.loginReward(s)}</div></div>
      <button class="btn big gold" data-a="claimlogin" data-r="home">${t('collect')}</button></div>`, 'dim');
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/main.js */
// Orquestación: bucle de juego, HUD, eventos -> audio/vibración/fx y acciones de los menús.
(function (g) {
  'use strict';
  const VS = (g.VS = g.VS || {});
  VS.VERSION = '1.0.0';
  // Debe apuntar a la política de privacidad publicada (ver store/PRIVACY.md y store/README.md).
  const PLAY_URL = 'https://play.google.com/store/apps/details?id=com.hyprarch.games.voidsurvivors';
  const PRIVACY_URL = 'https://github.com/maikolrlxd-blip/hyprarch/blob/main/games/void-survivors/store/PRIVACY.md';

  const D = VS.data, M = VS.Meta, S = VS.Save, UI = VS.UI, A = VS.Audio, I = VS.Input, U = VS.util, t = (k, v) => VS.t(k, v);
  const $ = (s) => g.document.querySelector(s);
  const STEP = 1 / 60;

  const App = (VS.App = { mode: 'boot', sim: null });
  let renderer, menuSim, acc = 0, last = 0, hudT = 0, paused = false, wonT = 0, deadT = 0;
  let levelShown = false, deadShown = false, finishing = false, itemsSig = '', hintKey = '', lastSum = null, resetArmed = 0;
  const shipImgs = {};

  const save = () => S.save();
  const shipImg = (id) => shipImgs[id] || (shipImgs[id] = renderer.shipSpr(id).c.toDataURL());
  const allShipImgs = () => { const o = {}; D.shipOrder.forEach((id) => (o[id] = shipImg(id))); return o; };

  // ------------------------------------------------------------------ arranque
  App.init = function () {
    S.load();
    const s = S.data;
    M.normalizeOwnership(s);
    VS.i18n.set(s.settings.lang || VS.i18n.detect());
    A.sfxOn = !!s.settings.sound; A.musOn = !!s.settings.music;
    renderer = App.renderer = new VS.Renderer($('#game'));
    I.attach($('#game'));
    menuSim = new VS.Sim({ ship: 'falcon', stage: s.selStage, meta: M.bonuses(S.defaults()), events: false });
    g.addEventListener('resize', () => { renderer.resize(); if (App.sim) App.sim.viewR = renderer.viewR; });
    g.addEventListener('pointerdown', () => A.init());
    g.addEventListener('keydown', (e) => { A.init(); if (e.code === 'Escape' || e.code === 'KeyP') App.togglePause(); });
    g.document.addEventListener('click', onClick);
    g.document.addEventListener('visibilitychange', () => {
      if (g.document.hidden) { A.suspend(); if (App.mode === 'game' && App.sim && App.sim.state === 'running') App.pause(); } else A.resume();
    });
    g.__onBack = App.back;
    $('#pausebtn').innerHTML = VS.iconImg('pause', '#fff');
    $('#killsStat').innerHTML = VS.iconImg('skull', '#f66') + '<span id="kv">0</span>';
    $('#coinsStat').innerHTML = VS.iconImg('coin', '#fc3') + '<span id="cv">0</span>';
    M.ensureDaily(s);
    const newDay = M.updateLogin(s);
    save();
    last = performance.now();
    requestAnimationFrame(loop);
    if (!s.tutorial.started && s.stats.runs === 0) { s.tutorial.started = true; save(); App.start(); return; } // primera vez: directo al juego
    App.home();
    if (newDay && !s.login.claimed) UI.loginPopup(s);
  };

  function onClick(e) {
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    A.init();
    App.act(el.dataset.a, el.dataset.v, el);
  }

  // ------------------------------------------------------------------ pantallas
  App.home = function () {
    App.mode = 'menu'; paused = false;
    I.enabled = false; I.release();
    $('#hud').classList.add('hidden');
    UI.home(S.data, shipImg(S.data.selShip));
    if (A.mode !== 'menu') A.startMusic('menu', 0);
  };
  const refresh = (name) => {
    const s = S.data;
    if (name === 'ships') UI.ships(s, allShipImgs());
    else if (name === 'upgrades') UI.upgrades(s);
    else if (name === 'missions') UI.missions(s);
    else if (name === 'trophies') UI.trophies(s);
    else if (name === 'settings') UI.settings(s, PRIVACY_URL);
  };
  let curScreen = '';
  const go = (name) => { curScreen = name; refresh(name); const sc = $('#screen .scr'); if (sc) sc.scrollTop = 0; };

  App.back = function () {
    if (App.mode === 'game' && App.sim) {
      if (App.sim.state === 'running' && !paused) { App.pause(); return true; }
      if (paused) { App.resume(); return true; }
      return true;
    }
    if (App.mode === 'results') { curScreen = ''; App.home(); return true; }
    if (App.mode === 'menu' && curScreen) { curScreen = ''; App.home(); return true; }
    return false;
  };

  // ------------------------------------------------------------------ acciones de la interfaz
  App.act = function (a, v, el) {
    const s = S.data;
    const click = () => A.sfx('click');
    switch (a) {
      case 'play': click(); App.start(); break;
      case 'home': click(); curScreen = ''; App.home(); break;
      case 'stage': {
        const i = D.stageOrder.indexOf(s.selStage) + (+v);
        if (i >= 0 && i < D.stageOrder.length) { s.selStage = D.stageOrder[i]; s.selDiff = Math.min(s.selDiff, M.maxDiff(s, s.selStage)); save(); click(); App.home(); }
        break;
      }
      case 'diff': if (+v <= M.maxDiff(s, s.selStage) && M.stageUnlocked(s, s.selStage)) { s.selDiff = +v; save(); click(); App.home(); } else { A.sfx('deny'); UI.toast(t('diff_lock', { d: t('diff.' + Math.max(0, +v - 1)) })); } break;
      case 'url': App.openUrl(v); break;
      case 'rate': s.rated = true; save(); App.openUrl(PLAY_URL); { const c = el && el.closest('.card'); if (c) c.remove(); } break;
      case 'ratelater': s.askedAt = s.stats.runs; save(); { const c = el && el.closest('.card'); if (c) c.remove(); } break;
      case 'ships': click(); go('ships'); break;
      case 'upgrades': click(); go('upgrades'); break;
      case 'missions': click(); go('missions'); break;
      case 'trophies': click(); go('trophies'); break;
      case 'settings': click(); go('settings'); break;
      case 'selship': s.selShip = v; save(); A.sfx('select'); refresh('ships'); break;
      case 'buyship':
        if (M.buyShip(s, v)) { s.selShip = v; save(); A.sfx('buy'); } else { A.sfx('deny'); UI.toast(t('not_enough')); }
        refresh('ships'); break;
      case 'buyupg':
        if (M.buyUpgrade(s, v)) { save(); A.sfx('buy'); } else { A.sfx('deny'); UI.toast(t('not_enough')); }
        { const sc = $('#screen .scr'), y = sc ? sc.scrollTop : 0; refresh('upgrades'); const n = $('#screen .scr'); if (n) n.scrollTop = y; }
        break;
      case 'claimlogin': {
        const r = M.claimLogin(s); save();
        if (r) { A.sfx('buy'); UI.toast('+' + r); }
        if (el && el.dataset.r === 'home') App.home(); else refresh('missions');
        break;
      }
      case 'claimmission': { const r = M.claimMission(s, +v); save(); if (r) { A.sfx('buy'); UI.toast('+' + r); } refresh('missions'); break; }
      case 'claimach': { const r = M.claimAch(s, v); save(); if (r) { A.sfx('buy'); UI.toast('+' + r); } refresh('trophies'); break; }
      case 'tog': {
        s.settings[v] = s.settings[v] ? 0 : 1;
        if (v === 'sound') A.setSfx(s.settings.sound); if (v === 'music') A.setMusic(s.settings.music);
        save(); A.sfx('click');
        if (el && el.dataset.r === 'pause') UI.pause(App.sim, s); else refresh('settings');
        break;
      }
      case 'lang': s.settings.lang = v; VS.i18n.set(v); save(); refresh('settings'); break;
      case 'reset':
        if (performance.now() - resetArmed < 4000) { S.reset(); M.normalizeOwnership(S.data); M.ensureDaily(S.data); M.updateLogin(S.data); save(); VS.i18n.set(VS.i18n.detect()); A.setSfx(1); A.setMusic(1); curScreen = ''; App.home(); }
        else { resetArmed = performance.now(); UI.toast(t('reset_confirm')); }
        break;
      case 'pause': App.pause(); break;
      case 'resume': App.resume(); break;
      case 'quit': paused = false; finish(); break;
      case 'choose': if (App.sim && App.sim.state === 'levelup') { App.sim.choose(+v); UI.clear(); levelShown = false; I.release(); A.sfx('click'); } break;
      case 'reroll': if (App.sim && App.sim.reroll()) { A.sfx('select'); UI.levelup(App.sim); } break;
      case 'revivead': VS.Ads.rewarded((ok) => { if (ok && App.sim && App.sim.adRevive()) { UI.clear(); deadShown = false; deadT = 0; } }); break;
      case 'giveup': finish(); break;
      case 'doublead':
        VS.Ads.rewarded((ok) => {
          if (!ok || !lastSum || lastSum.doubled) return;
          lastSum.doubled = true; s.coins += lastSum.total; s.stats.coinsEarned += lastSum.total; save();
          const gEl = $('#gained'), b = $('#dblbtn'); if (gEl) gEl.textContent = '+' + lastSum.total * 2; if (b) b.remove(); A.sfx('buy');
        });
        break;
    }
  };

  // Abre un enlace fuera del juego (en Android, mediante el puente nativo; el WebView no abre pestañas).
  App.openUrl = function (url) {
    try {
      if (g.AndroidNative && g.AndroidNative.openUrl) g.AndroidNative.openUrl(url);
      else g.open(url, '_blank', 'noopener');
    } catch (e) { /* sin navegador */ }
  };

  App.pause = function () {
    if (App.mode !== 'game' || !App.sim || App.sim.state !== 'running' || paused) return;
    paused = true; I.release(); UI.pause(App.sim, S.data);
  };
  App.resume = function () { if (!paused) return; paused = false; UI.clear(); };
  App.togglePause = function () { if (App.mode !== 'game') return; paused ? App.resume() : App.pause(); };

  // ------------------------------------------------------------------ partida
  App.start = function () {
    const s = S.data;
    if (!M.stageUnlocked(s, s.selStage)) { A.sfx('deny'); UI.toast(t('unlock_stage')); return; }
    curScreen = '';
    const diff = Math.min(s.selDiff || 0, M.maxDiff(s, s.selStage));
    const sim = (App.sim = new VS.Sim({ ship: s.selShip, stage: s.selStage, difficulty: diff, assist: s.stats.runs < D.ASSIST.runs && diff === 0, meta: M.bonuses(s), viewR: renderer.viewR }));
    for (const k of ['parts', 'texts', 'bolts', 'booms', 'banners']) renderer[k].length = 0;
    renderer.cam.x = renderer.cam.y = 0; renderer.shake = renderer.vig = 0;
    App.mode = 'game'; paused = false; acc = 0; wonT = 0; deadT = 0; levelShown = deadShown = finishing = false; itemsSig = ''; hintKey = '';
    I.enabled = true; I.release();
    $('#hud').classList.remove('hidden');
    $('#hint').classList.remove('on'); $('#hint').textContent = '';
    UI.clear();
    A.startMusic('battle', D.stages[s.selStage].music);
    A.intensity = 0;
    hudT = 0; updateHud(sim, true);
  };

  function finish() {
    if (finishing || !App.sim) return;
    finishing = true;
    const s = S.data, sim = App.sim, run = sim.result();
    const sum = M.applyRun(s, run);
    s.tutorial.done = true;
    save();
    lastSum = sum; sum.doubled = false;
    renderer.banners.length = 0;
    App.mode = 'results';
    I.enabled = false; I.release();
    $('#hud').classList.add('hidden');
    const early = s.stats.runs <= 6;
    UI.results(s, run, sum, VS.Ads.available() && sum.total > 0, {
      upgradeCta: early && M.canAffordUpgrade(s),
      askRate: !s.rated && (run.won || s.stats.runs >= 4) && (s.askedAt === undefined || s.stats.runs - s.askedAt >= 8),
    });
    A.startMusic('menu', 0);
  }

  // ------------------------------------------------------------------ eventos de la simulación
  function vibrate(ms) {
    if (!S.data.settings.vibe) return;
    try {
      if (g.AndroidNative && g.AndroidNative.vibrate) g.AndroidNative.vibrate(ms); // WebView: puente nativo
      else if (g.navigator && g.navigator.vibrate) g.navigator.vibrate(ms);
    } catch (e) { /* sin vibración */ }
  }
  function handle(ev, sim) {
    renderer.event(ev, sim, { numbers: S.data.settings.numbers, shake: S.data.settings.shake });
    switch (ev.type) {
      case 'shoot': A.sfx(ev.k === 'missile' ? 'missile' : 'shoot'); break;
      case 'kill': A.sfx('kill'); if (ev.boss) { A.sfx('boom'); vibrate(80); } break;
      case 'gem': A.sfx('gem'); break;
      case 'coin': A.sfx('coin'); break;
      case 'heal': case 'magnet': A.sfx('heal'); break;
      case 'bolt': A.sfx('bolt'); break;
      case 'boom': A.sfx('boom'); break;
      case 'nova': A.sfx('nova'); break;
      case 'hurt': A.sfx('hurt'); vibrate(35); break;
      case 'levelup': A.sfx('levelup'); break;
      case 'chest': A.sfx('chest'); break;
      case 'evolve': A.sfx('win'); vibrate(80); break;
      case 'warn': A.sfx('warn'); break;
      case 'boss': A.sfx('boss'); vibrate(120); break;
      case 'won': A.sfx('win'); vibrate(200); break;
      case 'dead': A.sfx('dead'); vibrate(200); break;
      case 'revive': A.sfx('levelup'); break;
    }
  }

  // ------------------------------------------------------------------ HUD
  function updateHud(sim, force) {
    $('#xpfill').style.width = Math.min(100, (sim.xp / sim.xpNeed) * 100) + '%';
    $('#lvl').textContent = t('level') + ' ' + sim.level;
    const hp = Math.max(0, sim.p.hp);
    $('#hpfill').style.width = Math.min(100, (hp / sim.st.maxHp) * 100) + '%';
    const mx = Math.round(sim.st.maxHp);
    $('#hptxt').textContent = Math.min(Math.ceil(hp), mx) + ' / ' + mx;
    $('#clock').textContent = U.fmtTime(sim.t);
    $('#kv').textContent = sim.kills;
    $('#cv').textContent = sim.coins;
    const sig = sim.weapons.map((w) => w.id + w.level).join() + '|' + JSON.stringify(sim.passives);
    if (force || sig !== itemsSig) {
      itemsSig = sig;
      $('#items').innerHTML = sim.weapons.map((w) => `<div class="it">${VS.iconImg(w.id, D.weapons[w.id].color)}<b>${w.level}</b></div>`).join('') +
        Object.keys(sim.passives).map((id) => `<div class="it">${VS.iconImg(id, D.passives[id].color)}<b>${sim.passives[id]}</b></div>`).join('');
    }
    // consejos del tutorial (solo la primera partida)
    const h = $('#hint');
    if (!S.data.tutorial.done) {
      const key = sim.t < 4 ? 'hint.move' : sim.t < 8 ? 'hint.auto' : sim.t < 14 ? 'hint.gems' : sim.t < 19 ? 'hint.boss' : '';
      if (key !== hintKey) { hintKey = key; h.textContent = key ? t(key) : ''; h.classList.toggle('on', !!key); }
    } else if (hintKey) { hintKey = ''; h.classList.remove('on'); }
  }

  // ------------------------------------------------------------------ bucle
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (App.mode === 'game' && App.sim) {
      const sim = App.sim;
      if (!paused && sim.state === 'running') {
        acc += dt;
        let n = 0;
        while (acc >= STEP && n < 4) { sim.update(STEP, I.vector()); acc -= STEP; n++; }
        if (n === 4) acc = 0;
      }
      for (let i = 0; i < sim.events.length; i++) handle(sim.events[i], sim);
      sim.events.length = 0;
      const frozen = paused || sim.state === 'levelup';
      renderer.update(frozen ? 0 : dt, sim);
      A.intensity = sim.bossAlive ? 2 : sim.t < 90 ? 0 : sim.t < 240 ? 1 : 2;

      if (sim.state === 'levelup' && !levelShown) { levelShown = true; I.release(); updateHud(sim, true); renderer.banners.length = 0; UI.levelup(sim); }
      if (sim.state === 'dead') {
        deadT += dt;
        if (!deadShown && deadT > 0.9) {
          deadShown = true;
          if (VS.Ads.available() && !sim.adRevived) UI.revive(true); else finish();
        }
      }
      if (sim.state === 'won') { wonT += dt; if (wonT > 2) finish(); }
      hudT -= dt;
      if (hudT <= 0 && sim.state !== 'levelup') { hudT = 0.1; updateHud(sim, false); }
      renderer.draw(sim, I, { menu: false });
    } else {
      renderer.cam.x += dt * 25; renderer.cam.y += dt * 9;
      renderer.update(dt, menuSim);
      renderer.draw(menuSim, null, { menu: true });
    }
  }

  g.addEventListener('DOMContentLoaded', App.init);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
