<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stack Tower</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const store={get(k,d){try{return +localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let ac;function beep(f,d=.08,t='square',v=.05,slide=0){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

const BH=0.6, TOL=0.12, START=3;     // altura de bloque, tolerancia "perfecto", tamaño inicial
let state='menu', blocks, cur, debris=[], score=0, combo, best=store.get('st_best',0), camY, camT, hue0, t=0, shake=0, flash=[], popups=[];
const C30=Math.cos(Math.PI/6), S30=Math.sin(Math.PI/6);

function reset(){
  hue0=Math.random()*360;
  blocks=[{x:0,z:0,w:START,d:START,lv:0}];
  debris=[];score=0;combo=0;camY=0;camT=0;popups=[];flash=[];
  spawn();
}
function spawn(){
  const top=blocks[blocks.length-1], lv=top.lv+1, axis=lv%2?'x':'z';
  cur={x:top.x,z:top.z,w:top.w,d:top.d,lv,axis,dir:1,t:0,
       speed:1.6+Math.min(lv,60)*0.045};
  cur[axis]=-4.2;
}
function color(lv,s,l){return `hsl(${(hue0+lv*9)%360},${s}%,${l}%)`}
function proj(x,y,z,S){return[(x-z)*C30*S,(x+z)*S30*S-y*S]}

function box(b,S,ox,oy,alpha=1,yy){
  const x0=b.x-b.w/2,x1=b.x+b.w/2,z0=b.z-b.d/2,z1=b.z+b.d/2,y0=yy!==undefined?yy:b.lv*BH,y1=y0+BH;
  const P=(x,y,z)=>{const p=proj(x,y,z,S);return[ox+p[0],oy+p[1]]};
  const poly=(pts,fill)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill()};
  ctx.globalAlpha=alpha;
  poly([P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1),P(x1,y0,z0)],color(b.lv,70,38));   // cara +x
  poly([P(x0,y1,z1),P(x1,y1,z1),P(x1,y0,z1),P(x0,y0,z1)],color(b.lv,70,30));   // cara +z
  poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],color(b.lv,75,58));   // techo
  ctx.globalAlpha=1;
}

function place(){
  if(state==='menu'){reset();state='play';beep(440,.1);return}
  if(state==='over'){if(t-overAt>.5){reset();state='play'}return}
  const top=blocks[blocks.length-1], a=cur.axis, sz=a==='x'?'w':'d';
  const lo=Math.max(top[a]-top[sz]/2,cur[a]-cur[sz]/2), hi=Math.min(top[a]+top[sz]/2,cur[a]+cur[sz]/2);
  const ov=hi-lo;
  if(ov<=0){ // fallo: el bloque cae entero
    debris.push({...cur,vy:0,y:cur.lv*BH,vx:0,rot:0});
    cur=null;state='over';overAt=t;shake=.5;beep(120,.5,'sawtooth',.08,-80);
    if(score>best){best=score;store.set('st_best',best)}
    return;
  }
  const delta=cur[a]-top[a];
  if(Math.abs(delta)<TOL){
    cur[a]=top[a];combo++;
    if(combo>=4&&cur[sz]<START){cur[sz]=Math.min(START,cur[sz]+0.25)}   // recompensa por racha
    flash.push({b:{...cur},t:0});
    popups.push({txt:combo>1?`PERFECTO x${combo}`:'PERFECTO',t:0});
    beep(520+Math.min(combo,12)*60,.14,'triangle',.07);
  }else{
    combo=0;
    const cut={...cur,y:cur.lv*BH,vy:0,vx:0,rot:0};
    const sign=delta>0?1:-1;
    cut[sz]=cur[sz]-ov;cut[a]=sign>0?hi+cut[sz]/2:lo-cut[sz]/2;
    debris.push(cut);
    cur[a]=(lo+hi)/2;cur[sz]=ov;
    beep(300,.09,'square',.05);
  }
  blocks.push({x:cur.x,z:cur.z,w:cur.w,d:cur.d,lv:cur.lv});
  score++;camT=score*BH;
  spawn();
}
let overAt=0;

function update(dt){
  t+=dt;
  camY+=(camT-camY)*Math.min(1,dt*5);
  shake=Math.max(0,shake-dt);
  if(state==='play'&&cur){
    cur.t+=dt*cur.speed*cur.dir;
    const a=cur.axis;cur[a]+=dt*cur.speed*cur.dir*2.2;
    if(cur[a]>4.2){cur[a]=4.2;cur.dir=-1}
    if(cur[a]<-4.2){cur[a]=-4.2;cur.dir=1}
  }
  debris.forEach(d=>{d.vy-=18*dt;d.y+=d.vy*dt});
  debris=debris.filter(d=>d.y>-30);
  flash.forEach(f=>f.t+=dt);flash=flash.filter(f=>f.t<.4);
  popups.forEach(p=>p.t+=dt);popups=popups.filter(p=>p.t<.9);
}

function draw(){
  const S=Math.min(W,H*.62)/9;
  const g=ctx.createLinearGradient(0,0,0,H);
  const h=(hue0||200)+score*3;
  g.addColorStop(0,`hsl(${h%360},60%,${state==='menu'?30:22}%)`);g.addColorStop(1,`hsl(${(h+60)%360},55%,10%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!blocks){ctx.fillStyle='#fff';title();return}
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*14*shake;sy=(Math.random()-.5)*14*shake}
  const ox=W/2+sx, oy=H*.68+camY*S+sy;
  blocks.forEach(b=>box(b,S,ox,oy));
  debris.forEach(d=>box(d,S,ox,oy,Math.max(0,Math.min(1,1+d.y/12)),d.y));
  if(cur)box(cur,S,ox,oy);
  flash.forEach(f=>{const k=f.t/.4;const b={...f.b,w:f.b.w*(1+k*.5),d:f.b.d*(1+k*.5),lv:f.b.lv};box(b,S,ox,oy,.5*(1-k))});
  // HUD
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font=`800 ${Math.min(W,H)*.16}px system-ui,sans-serif`;
  ctx.globalAlpha=.9;ctx.fillText(score,W/2,H*.18);ctx.globalAlpha=1;
  popups.forEach(p=>{ctx.globalAlpha=1-p.t/.9;ctx.font=`700 ${Math.min(W,H)*.06}px system-ui`;ctx.fillText(p.txt,W/2,H*.26-p.t*40)});ctx.globalAlpha=1;
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';
    ctx.font=`800 ${Math.min(W,H)*.1}px system-ui`;ctx.fillText('Fin del juego',W/2,H*.38);
    ctx.font=`600 ${Math.min(W,H)*.06}px system-ui`;ctx.fillText(`Puntos: ${score}   Récord: ${best}`,W/2,H*.46);
    if(Math.sin(t*5)>-.3)ctx.fillText('Toca para reintentar',W/2,H*.56);
  }
  if(state==='menu')title();
}
function title(){
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font=`900 ${Math.min(W,H)*.14}px system-ui`;ctx.fillText('STACK',W/2,H*.35);ctx.fillText('TOWER',W/2,H*.35+Math.min(W,H)*.15);
  ctx.font=`600 ${Math.min(W,H)*.05}px system-ui`;ctx.fillText(`Récord: ${best}`,W/2,H*.58);
  if(Math.sin(t*4)>-.3)ctx.fillText('Toca para jugar',W/2,H*.68);
  ctx.font=`${Math.min(W,H)*.04}px system-ui`;ctx.globalAlpha=.7;ctx.fillText('Apila los bloques con precisión',W/2,H*.78);ctx.globalAlpha=1;
}

addEventListener('pointerdown',e=>{e.preventDefault();place()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')place()});
addEventListener('contextmenu',e=>e.preventDefault());
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__game={get state(){return state},get score(){return score},get cur(){return cur},get blocks(){return blocks},place};
</script></body></html>
