name: Build apps

# Instaladores de AI World: PC (Windows/Linux) y Android (APK).
# Manual desde la pestaña Actions, o al subir una etiqueta v* (publica un Release con los archivos).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths: ["ai-world/**", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["ai-world/**", ".github/workflows/apps.yml"]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ai-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-world/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            ai-world/dist/*.exe
            ai-world/dist/*.AppImage
            ai-world/dist/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-world/android
    steps:
      - uses: actions/checkout@v4
      # El APK empaqueta el mundo 3D (src/ + three.js desde node_modules), asi que hacen falta las dependencias de Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-world/package-lock.json
      - run: npm ci
        working-directory: ai-world
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk AI-World.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ai-world/android/AI-World.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
