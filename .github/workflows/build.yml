name: Build ISO

on:
  workflow_dispatch:
    inputs:
      dev:
        description: "Modo desarrollo (SSH con llave, solo para la VM)"
        type: boolean
        default: false
      edition:
        description: "Edición: public (sin ninguna IA incluida; la que se comparte) o personal (con Claude Code, solo uso propio: no se redistribuye)"
        type: choice
        options: [personal, public]
        default: public
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Instalar git
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v4

      - name: Compilar la ISO
        env:
          HYPRARCH_DEV: ${{ inputs.dev && '1' || '0' }}
          HYPRARCH_EDITION: ${{ inputs.edition || 'public' }}
        run: |
          sed -i 's/\r$//' build.sh
          bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ (inputs.edition == 'personal') && 'hyprarch-iso' || 'hyprarch-iso-public' }}
          path: out/*.iso
          compression-level: 0
          retention-days: 7
