name: Build Android games

# Compila el APK (debug) y el AAB (release) de un juego de games/.
# Si defines los secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD, el AAB sale firmado.
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Juego a compilar"
        type: choice
        default: void-survivors
        options: [void-survivors, stack-tower, gravity-flip, space-blaster]
  push:
    paths: ["games/**", ".github/workflows/android-games.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME: ${{ inputs.game || 'void-survivors' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Pruebas de lógica (Void Survivors)
        if: env.GAME == 'void-survivors'
        run: node games/void-survivors/tools/test.js

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }

      - name: Generar proyecto Android
        run: cd games && ./build-android.sh "$GAME"

      - name: Preparar firma (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Sin keystore: el AAB/APK release saldrá sin firmar."
          fi

      - name: Compilar
        working-directory: games/build/${{ env.GAME }}-android
        run: gradle --no-daemon -PversionCode=${{ github.run_number }} assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME }}-android
          path: |
            games/build/${{ env.GAME }}-android/app/build/outputs/apk/debug/*.apk
            games/build/${{ env.GAME }}-android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
